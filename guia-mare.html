function read(key){try{const x=JSON.parse(localStorage.getItem(key)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}catch(e){return {};}}

function save(id,mode){const fresh=read('guia_mare_prog'),stamp=new Date().toISOString();const next={...fresh,passos:{...fresh.passos,...memory.passos}};if(id)next.passos[id]=stamp;if(mode)next[mode]=stamp;memory=next;try{localStorage.setItem('guia_mare_prog',JSON.stringify(next));}catch(e){}}

// ── Telas reais do Maré (capturadas por scripts/guia-mare-telas.js) ──

const TELAS=(()=>{try{return JSON.parse(document.getElementById('telas-mare').textContent);}catch(e){return null;}})();
const MOLDURA_CSS='.mg-html{position:relative;font-family:"DM Sans",sans-serif}.mg-vp{position:absolute;top:0;left:0;transform-origin:0 0;overflow:hidden;pointer-events:none;user-select:none}.mg-vp *{animation:none!important;transition:none!important;caret-color:transparent}.mg-body{min-height:100%;margin:0}.mg-alvo{position:absolute;border-radius:10px;box-shadow:0 0 0 3px #1de9b6,0 0 0 9999px rgba(2,8,16,.5);z-index:2147483646;pointer-events:none}.mg-alvo.pisca{animation:mgPisca 1.1s ease-in-out 2!important}@keyframes mgPisca{50%{box-shadow:0 0 0 6px rgba(29,233,182,.55),0 0 0 9999px rgba(2,8,16,.5)}}@media (prefers-reduced-motion:reduce){.mg-alvo.pisca{animation:none!important}}';

function telaReal(id,titulo){
  const a=TELAS&&TELAS.alvos&&TELAS.alvos[id];if(!a)return null;const html=mgHtml(a.tela);if(!html)return null;
  const fig=document.createElement('figure');fig.className='tela';fig.setAttribute('aria-label','Tela do Maré Digital: '+titulo);

  const zoom=document.createElement('button');zoom.type='button';bar.append(zoom);
  const host=document.createElement('div');host.className='tela-host';
  const cap=document.createElement('figcaption');cap.className='tela-caption';cap.textContent='Tela real do Maré (captura de '+TELAS.capturadoEm.split('-').reverse().join('/')+', dados fictícios).'+(a.alvo?' O destaque mostra onde agir.':'');
  fig.append(bar,host,cap);
  const sr=host.attachShadow({mode:'open'});

  sr.adoptedStyleSheets=[mgFolha];
  const tema=document.documentElement.dataset.theme==='light'?'light':'';
  const raiz=document.createElement('div');raiz.className='mg-html';if(tema)raiz.setAttribute('data-theme',tema);
  const vp=document.createElement('div');vp.className='mg-vp';vp.style.width=TELAS.w+'px';vp.style.height=TELAS.h+'px';vp.style.transform='scale(.01)';vp.style.visibility='hidden';host.style.height='0px';
  const tpl=document.createElement('template');tpl.innerHTML=html;vp.append(tpl.content);

  let inteira=false;
  function desenhar(){
    const W=TELAS.w,H=TELAS.h,hw=host.clientWidth||W;let alvo=null;try{alvo=vp.querySelector(a.alvo);}catch(e){}
    vp.querySelectorAll('.mg-alvo').forEach(e=>e.remove());vp.style.transform='scale(1)';
    vp.querySelectorAll('[data-mg-scroll],[data-mg-scroll-x]').forEach(e=>{e.scrollTop=+e.dataset.mgScroll||0;e.scrollLeft=+e.dataset.mgScrollX||0;});
    let r=null;if(alvo){const ar=alvo.getBoundingClientRect(),vr=vp.getBoundingClientRect();if(ar.width>0&&ar.height>0)r={x:ar.left-vr.left,y:ar.top-vr.top,w:ar.width,h:ar.height};}
    if(r){const m=document.createElement('div');m.className='mg-alvo pisca';const pad=6;Object.assign(m.style,{left:(r.x-pad)+'px',top:(r.y-pad)+'px',width:(Math.min(r.w,W)+pad*2)+'px',height:(Math.min(r.h,H)+pad*2)+'px'});vp.append(m);}
    const estreita=hw<700;zoom.hidden=!estreita||!r;zoom.textContent=inteira?'🔍 Aproximar':'🖥 Tela inteira';
    if(!estreita||inteira||!r){const s=hw/W;vp.style.transform='scale('+s+')';host.style.height=Math.round(H*s)+'px';raiz.style.height=host.style.height;return;}
    const cw=Math.max(360,Math.min(W,r.w+60)),s=Math.min(1,hw/cw),vw=hw/s,vh=Math.min(H,Math.max(240/s,Math.min(r.h+80,560/s)));const cx=r.x+r.w/2,cy=r.y+Math.min(r.h,vh-40)/2;

  requestAnimationFrame(()=>{desenhar();vp.style.visibility='';});if(window.ResizeObserver)new ResizeObserver(()=>desenhar()).observe(host);
  return fig;
}
function start(m){modo=m;idx=0;render();}
function navigate(n){idx=Math.max(0,Math.min(passos(modo).length,n));render();}
function refreshChecks(){document.querySelectorAll('[data-step]').forEach(b=>{const id=b.dataset.step;b.textContent=(finished(id)?'✓ ':'')+CONTENT.find(s=>s[0]===id)[1];});if(modo){const ids=passos(modo),n=ids.filter(finished).length;$('progress-label').textContent=n+' de '+ids.length+' passos concluídos · '+Math.round(n/ids.length*100)+'%';$('progress').value=n;}}
function index(){const nav=$('index');nav.replaceChildren();let chapter='';passos(modo).forEach((id,n)=>{const s=CONTENT.find(s=>s[0]===id);if(s[3]!==chapter){chapter=s[3];const h=document.createElement('h3');h.textContent=chapter;nav.append(h);}const b=document.createElement('button');b.dataset.step=id;b.textContent=s[1];if(n===idx)b.setAttribute('aria-current','step');b.onclick=()=>navigate(n);nav.append(b);});}
function render(){const main=$('main');$('aside').hidden=modo!=='completo';$('shell').className='shell'+(modo==='completo'?'':' solo');
if(!modo){main.innerHTML='<section class="glass"><span class="eyebrow">BEM-VINDO AO MARÉ DIGITAL</span><h1>Seu trabalho encontra o fluxo.</h1><p>O Maré Digital organiza as entregas e as conversas do time em um quadro compartilhado.</p><p>Este é o onboarding da <strong>ferramenta</strong>, para aprender no seu ritmo. O <a href="onboarding.html">A Bordo</a> é o onboarding do método ágil.</p><div class="choices"><button id="short"><strong>⚡ Resumido</strong>5 min · o essencial para começar</button><button id="full"><strong>📚 Completo</strong>Todos os recursos, passo a passo</button></div><p class="storage-note">O progresso fica neste navegador até o board recebê-lo. Sem armazenamento disponível, você ainda pode percorrer todo o guia.</p></section>';$('short').onclick=()=>start('resumido');$('full').onclick=()=>start('completo');return;}

else{const id=ids[idx],s=CONTENT.find(s=>s[0]===id);area.innerHTML='<span class="eyebrow">'+(modo==='resumido'?'RESUMIDO':'COMPLETO')+' · PASSO '+(idx+1)+' DE '+ids.length+'</span><h1 tabindex="-1" id="step-title">'+esc(s[1])+'</h1><p>'+esc(s[2])+'</p><div id="tela-slot"></div><ol>'+s[4].split('|').map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="actions" id="actions"></div><div class="actions"><button class="primary" id="complete">Concluir passo ✓</button></div><div class="nav"><button id="prev" '+(idx===0?'disabled':'')+'>← Voltar</button><button id="skip">Pular →</button></div>';{const slot=$('tela-slot'),f=telaReal(id,s[1]);if(f)slot.replaceWith(f);else slot.outerHTML=simulation(s);}if(essential.includes(id)){const b=document.createElement('button');b.id='do-board';b.textContent='👉 Fazer no board';b.onclick=()=>openBoard('tour='+encodeURIComponent(id));$('actions').append(b);}if(agent){const b=document.createElement('button');b.id='ask-agent';b.textContent='🤖 Pergunte ao Agente';b.onclick=()=>openBoard('hotline=1');$('actions').append(b);}$('complete').onclick=()=>{save(id);if(ids.every(finished))save(null,modo);navigate(idx+1);};$('prev').onclick=()=>navigate(idx-1);$('skip').onclick=()=>navigate(idx+1);}
