<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guia do Maré</title><link rel="icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>

7px 9px}.index button[aria-current="step"]{border-color:var(--accent);background:var(--glass)}summary{cursor:pointer;min-height:44px;padding:10px 0}ol{padding-left:25px}li{padding:5px 0}.nav{justify-content:space-between;border-top:1px solid var(--glass-b);padding-top:18px}.sim{margin:24px 0;border:1px solid var(--glass-b);border-radius:12px;background:rgba(var(--surface-rgb),.85);overflow:hidden;font-size:13px}.sim-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--glass-b)}.sim-head b{margin-right:auto}.sim-body{padding:18px}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.column{min-width:0;background:var(--glass);border-radius:9px;padding:10px}.column h3{font:600 12px 'DM Sans',sans-serif;margin:0 0 12px}.card,.mini-row{border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.95);border-radius:8px;padding:12px;margin:8px 0}.card strong{display:block;margin-bottom:8px}.tag{font-size:11px;color:var(--accent)}.spot{border:2px solid var(--accent);padding:10px;border-radius:8px;position:relative;margin:10px 0;animation:point 1s ease 2}.spot:after{content:'↖';font-size:24px;color:var(--accent);position:absolute;right:6px;bottom:-17px}.mini-modal{max-width:510px;margin:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sim-caption{display:block;padding:10px 18px;border-top:1px solid var(--glass-b);font-size:12px;color:var(--txt2)}@keyframes point{50%{box-shadow:0 0 0 4px var(--glass-b)}}[hidden]{display:none!important}.storage-note{font-size:13px}.done{color:var(--accent)}

</style></head><body><header><button id="home" class="brand">🌊 Guia do Maré</button><label>Tema <select id="theme" aria-label="Tema"><option value="dark">Escuro</option><option value="light">Claro</option><option value="system">Sistema</option></select></label></header><div id="shell" class="shell solo"><aside id="aside" hidden><details id="index-details"><summary>Índice do guia</summary><nav class="index" id="index" aria-label="Passos"></nav></details></aside><main id="main"></main></div>

ar dúvida, problema ou sugestão.", "panel", "📢 Mural · Avisos · Fale com o ADM"], ["kudos", "Envie uma Estrela do Mar", "Reconheça uma ajuda que fez diferença.", "Falar com o time", "Abra 🎉 ao lado do sino.|Escolha Sua Squad ou Geral.|Selecione a pessoa.|Escreva o reconhecimento e envie.", "panel", "⭐ Estrelas do Mar · Para quem?"], ["ilha", "Proteja seu tempo", "Timer e Ilha Dinâmica ajudam a acompanhar o dia.", "Produtividade", "Abra o Timer para organizar um período de foco.|Procure os ajustes da Ilha Dinâmica quando disponível.|Escolha os módulos que deseja acompanhar.", "panel", "🏝️ Ilha Dinâmica · Timer · Ajustes"], ["dicas", "Descubra pequenos atalhos", "As dicas mostram recursos úteis aos poucos.", "Produtividade", "Abra ❓ Central de Ajuda.|Use 💡 Dicas do Maré para ligar ou desligar.|Escolha Rever dicas para vê-las novamente.", "panel", "❓ Ajuda · 💡 Dicas do Maré · Rever dicas"], ["metas", "Acompanhe as metas", "Veja o ritmo da squad e os desafios do Digital.", "Visões e dados", "Abra 📊 Dados na lateral.|Escolha 🐠 sua squad ou 🌊 Digital.|Confira o realizado e o ritmo esperado.", "panel", "📊 Dados · 🐠 sua squad · 🌊 Digital"], ["tema", "Escolha seu tema", "Ajuste a leitura ao seu ambiente.", "Personalizar", "Localize o controle de tema do Maré.|Escolha a aparência que prefere.|Confira a leitura dos cards.", "panel", "🌙 Tema · Aparência"], ["config", "Ajuste suas preferências", "Deixe o quadro mais confortável para o seu uso.", "Personalizar", "Abra ⚙ Configurações.|Procure Minhas preferências.|Ajuste as opções disponíveis para você.", "panel", "⚙ Configurações · Minhas preferências"], ["pausar-continuo", "Diferencie pausa e trabalho contínuo", "A contagem deve representar como o trabalho acontece.", "Produtividade", "Abra o card.|Use ⏸ para pausar ou retomar a contagem quando necessário.|Consulte a opção de card contínuo para atividades sem encerramento pontual.", "card", "⏸ Pausar contagem · Contínuo"], ["arquivar-excluir", "Guarde ou remova com cuidado", "Arquivar e excluir têm finalidades diferentes.", "Organizar o board", "Abra o card.|Use 📦 Arquivar para guardar fora do quadro ativo.|Reserve 🗑 Excluir para o que deve ser removido.|Leia a confirmação antes de continuar.", "card", "📦 Arquivar · 🗑 Excluir"], ["duplicar-modelo", "Reaproveite uma estrutura", "Evite montar do zero uma entrega parecida.", "Produtividade", "Abra um card que sirva de referência.|Use ⧉ Duplicar para criar uma cópia ou 📋 Salvar como modelo para reutilizar.|Revise os dados antes de usar o novo card.", "card", "⧉ Duplicar · 📋 Salvar como modelo"], ["spotify", "Sobre o Spotify", "Saiba distinguir recursos disponíveis de conteúdo guardado na Ajuda.", "Personalizar", "Considere a integração Spotify pausada no Maré.|Use os outros recursos do guia para começar.|Consulte a Ajuda se a integração voltar a ficar disponível.", "panel", "🎧 Spotify · Integração pausada"]];
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const agent=params.get('agente')==='1';
const back=['kanban.html','kanban-dev.html'].includes(params.get('volta'))?params.get('volta'):'kanban.html';
const squad=/^[a-z0-9_-]{1,40}$/.test(params.get('squad')||'')?params.get('squad'):'';
const essential=CONTENT.slice(0,9).map(s=>s[0]);
const validMode=m=>m==='resumido'||m==='completo';
let modo=validMode(params.get('modo'))?params.get('modo'):null,idx=0;
// Nenhum valor de URL ou de storage entra em HTML. Os templates abaixo só usam o catálogo local.
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const passos=m=>(m==='completo'?CONTENT.map(s=>s[0]):essential).filter(id=>agent||id!=='agente');
function read(key){try{const x=JSON.parse(localStorage.getItem(key)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}catch(e){return {};}}
function merged(){const a=read('guia_mare_prog_espelho'),b=read('guia_mare_prog');return {...a,...b,passos:{...a.passos,...b.passos}};}
let memory={passos:{}};
function save(id,mode){const fresh=read('guia_mare_prog'),stamp=new Date().toISOString();const next={...fresh,passos:{...fresh.passos,...memory.passos}};if(id)next.passos[id]=stamp;if(mode)next[mode]=stamp;memory=next;try{localStorage.setItem('guia_mare_prog',JSON.stringify(next));}catch(e){}}
const finished=id=>!!(merged().passos[id]||memory.passos[id]);
function boardUrl(extra){const pairs=[];if(squad)pairs.push('squad='+encodeURIComponent(squad));if(extra)pairs.push(extra);return back+(pairs.length?'?'+pairs.join('&'):'');}
function openBoard(extra){window.open(boardUrl(extra),'mare_board');}
function card(title){return '<div class="card"><strong>'+esc(title)+'</strong><span class="tag">Entrega · Prioridade normal</span><br><small>Responsável · Prazo hoje · ☑ 1/2</small></div>';}
function column(title,body){return '<div class="column"><h3>'+esc(title)+'</h3>'+body+'</div>';}
function simulation(s){const [id,title,why,chapter,steps,type,focus]=s;let body='';
if(type==='board'){body='<div class="spot">'+esc(focus)+'</div><div class="columns">'+column('A fazer',card('Preparar briefing'))+column('Em progresso',card('Revisar a entrega'))+column('Concluído',card('Publicar material'))+'</div>';}
else if(type==='card'){body='<div class="mini-modal"><h3>Revisar a entrega</h3><div class="fields"><div class="mini-row">👤 Responsável</div><div class="mini-row">📅 Prazo · Hoje</div></div><div class="mini-row">Descrição · O que vamos entregar</div><div class="mini-row">☑ Checklist<br>✓ Preparar material<br>□ Revisar conteúdo</div><div class="spot">'+esc(focus)+'</div><div class="mini-row">💬 Comentários · Decisões da entrega</div></div>';}
else{body='<div class="mini-modal"><div class="spot">'+esc(focus)+'</div>'+ (id==='sonar'?'<div class="mini-row">Tudo · Este board · Radar · Squads · Ajuda</div><div class="mini-row">🔍 Revisar entrega</div>':id==='notificacoes'?'<div class="mini-row">🔔 Você recebeu um card</div><div class="mini-row">🔕 Não Perturbe</div>':id==='meu-dia'||id==='timeline'?'<div class="mini-row">Hoje</div>':'')+card(id==='kudos'?'Reconhecimento pela ajuda':'Revisar a entrega')+'</div>';}
return '<figure class="sim" aria-label="Exemplo simulado: '+esc(title)+'"><div class="sim-head"><b>🌊 Maré Digital</b><span>🔔</span><span>🔍</span><span>🌅 Meu Dia</span></div><div class="sim-body">'+body+'</div><figcaption class="sim-caption">Tela simulada · dados fictícios · o destaque indica onde agir no Maré.</figcaption></figure>';}
function start(m){modo=m;idx=0;render();}
function navigate(n){idx=Math.max(0,Math.min(passos(modo).length,n));render();}
function refreshChecks(){document.querySelectorAll('[data-step]').forEach(b=>{const id=b.dataset.step;b.textContent=(finished(id)?'✓ ':'')+CONTENT.find(s=>s[0]===id)[1];});if(modo){const ids=passos(modo),n=ids.filter(finished).length;$('progress-label').textContent=n+' de '+ids.length+' passos concluídos · '+Math.round(n/ids.length*100)+'%';$('progress').value=n;}}
function index(){const nav=$('index');nav.replaceChildren();let chapter='';passos(modo).forEach((id,n)=>{const s=CONTENT.find(s=>s[0]===id);if(s[3]!==chapter){chapter=s[3];const h=document.createElement('h3');h.textContent=chapter;nav.append(h);}const b=document.createElement('button');b.dataset.step=id;b.textContent=s[1];if(n===idx)b.setAttribute('aria-current','step');b.onclick=()=>navigate(n);nav.append(b);});}
function render(){const main=$('main');$('aside').hidden=modo!=='completo';$('shell').className='shell'+(modo==='completo'?'':' solo');
if(!modo){main.innerHTML='<section class="glass"><span class="eyebrow">BEM-VINDO AO MARÉ DIGITAL</span><h1>Seu trabalho encontra o fluxo.</h1><p>O Maré Digital organiza as entregas e as conversas do time em um quadro compartilhado.</p><p>Este é o onboarding da <strong>ferramenta</strong>, para aprender no seu ritmo. O <a href="onboarding.html">A Bordo</a> é o onboarding do método ágil.</p><div class="choices"><button id="short"><strong>⚡ Resumido</strong>5 min · o essencial para começar</button><button id="full"><strong>📚 Completo</strong>Todos os recursos, passo a passo</button></div><p class="storage-note">O progresso fica neste navegador até o board recebê-lo. Sem armazenamento disponível, você ainda pode percorrer todo o guia.</p></section>';$('short').onclick=()=>start('resumido');$('full').onclick=()=>start('completo');return;}
const ids=passos(modo);index();main.innerHTML='<div class="progress"><span id="progress-label" aria-live="polite"></span><progress id="progress" max="'+ids.length+'" value="0" aria-label="Passos concluídos"></progress></div><section class="glass" id="step"></section>';const area=$('step');
if(idx===ids.length){area.innerHTML='<span class="eyebrow">PERCURSO FINALIZADO</span><h1>Você chegou ao fim!</h1><p>Volte ao Maré para praticar. Os passos marcados continuam disponíveis para consulta.</p><p id="pending"></p><div class="actions"><button id="return">Voltar ao board</button><button id="other">'+(modo==='resumido'?'📚 Explorar o Completo':'⚡ Rever o Resumido')+'</button></div><div class="nav"><button id="prev">← Voltar</button></div>';$('pending').textContent=ids.every(finished)?'Todos os passos concluídos ✓':'Você pulou alguns passos. Use Voltar ou o índice para retomá-los.';$('return').onclick=()=>openBoard('');$('other').onclick=()=>start(modo==='resumido'?'completo':'resumido');$('prev').onclick=()=>navigate(idx-1);}
else{const id=ids[idx],s=CONTENT.find(s=>s[0]===id);area.innerHTML='<span class="eyebrow">'+(modo==='resumido'?'RESUMIDO':'COMPLETO')+' · PASSO '+(idx+1)+' DE '+ids.length+'</span><h1 tabindex="-1" id="step-title">'+esc(s[1])+'</h1><p>'+esc(s[2])+'</p>'+simulation(s)+'<ol>'+s[4].split('|').map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><div class="actions" id="actions"></div><div class="actions"><button class="primary" id="complete">Concluir passo ✓</button></div><div class="nav"><button id="prev" '+(idx===0?'disabled':'')+'>← Voltar</button><button id="skip">Pular →</button></div>';if(essential.includes(id)){const b=document.createElement('button');b.id='do-board';b.textContent='👉 Fazer no board';b.onclick=()=>openBoard('tour='+encodeURIComponent(id));$('actions').append(b);}if(agent){const b=document.createElement('button');b.id='ask-agent';b.textContent='🤖 Pergunte ao Agente';b.onclick=()=>openBoard('hotline=1');$('actions').append(b);}$('complete').onclick=()=>{save(id);if(ids.every(finished))save(null,modo);navigate(idx+1);};$('prev').onclick=()=>navigate(idx-1);$('skip').onclick=()=>navigate(idx+1);}
refreshChecks();}
$('home').onclick=()=>{modo=null;idx=0;render();};
const media=matchMedia('(prefers-color-scheme: light)');let theme='dark';try{theme=localStorage.getItem('guia_mare_tema')||'dark';}catch(e){}if(!['dark','light','system'].includes(theme))theme='dark';
function applyTheme(){document.documentElement.dataset.theme=theme==='system'?(media.matches?'light':'dark'):theme;document.documentElement.dataset.themePreference=theme;$('theme').value=theme;}
$('theme').onchange=()=>{theme=$('theme').value;try{localStorage.setItem('guia_mare_tema',theme);}catch(e){}applyTheme();};media.addEventListener('change',applyTheme);applyTheme();
window.addEventListener('storage',refreshChecks);window.addEventListener('focus',refreshChecks);
document.addEventListener('keydown',e=>{if(!modo||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();navigate(idx+(e.key==='ArrowRight'?1:-1));}});
$('index-details').open=matchMedia('(min-width:701px)').matches;
window.GuiaMare={passos:m=>passos(m).slice(),estado:()=>({modo,idx,id:modo?(passos(modo)[idx]||null):null})};render();
</script></body></html>
