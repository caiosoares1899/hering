<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Maré Digital · Apresentação OKR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

:root{
  --deep:#030d1a; --deep-rgb:3,13,26;
  --glass:rgba(10,37,64,0.6); --glass-b:rgba(56,182,255,0.18); --glass-hover:rgba(56,182,255,.12);
  --blue:#2563c9; --accent:#38b6ff; --cyan:#7ec8e3; --teal:#1de9b6;
  --txt:#e8f4fd; --txt2:rgba(200,230,255,0.65); --txt3:rgba(150,200,240,0.4);
  --warn:#ffd166; --danger:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--deep);color:var(--txt);}
h1,h2,h3,.syne{font-family:'Syne',sans-serif;}

.ocean{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 80%,rgba(0,80,160,.4) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(0,150,180,.25) 0%,transparent 55%),#010810;}

/* ── Login ── */
#login-ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;}
#login-ov[hidden]{display:none;}
.login-card{position:relative;z-index:2;background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;
  backdrop-filter:blur(18px);padding:40px 44px;text-align:center;max-width:360px;}
.login-card .ico{font-size:40px;margin-bottom:10px;}
.login-card h1{font-size:20px;margin-bottom:6px;}
.login-card p{font-size:12px;color:var(--txt2);margin-bottom:20px;line-height:1.5;}
.g-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:none;border-radius:10px;
  padding:11px 22px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.g-btn:hover{background:#f3f3f3;}
.login-err{margin-top:16px;font-size:11px;color:var(--danger);line-height:1.5;}
.login-out{margin-top:14px;background:none;border:1px solid var(--glass-b);color:var(--txt2);border-radius:8px;
  padding:6px 14px;font-size:11px;cursor:pointer;}

/* ── App shell ── */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;}
#app[hidden]{display:none;}

#topbar{display:flex;align-items:center;gap:16px;padding:0 22px;height:58px;flex-shrink:0;
  background:rgba(3,13,26,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-b);}
.tb-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.02em;flex-shrink:0;}
.tb-live{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--teal);letter-spacing:.06em;text-transform:uppercase;font-weight:700;flex-shrink:0;}
.tb-live-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(29,233,182,.5);}50%{opacity:.4;box-shadow:0 0 0 5px rgba(29,233,182,0);}}
.tb-clock{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--txt2);letter-spacing:.05em;flex-shrink:0;}
.tb-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
.tb-title{font-size:12px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.tb-bar{width:min(280px,40vw);height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.tb-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));transition:width .35s ease;}
.tb-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.tb-btn{background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;color:var(--txt);
  padding:7px 12px;font-size:14px;cursor:pointer;line-height:1;font-family:inherit;}
.tb-btn:hover{background:var(--glass-hover);}
.tb-btn:disabled{opacity:.3;cursor:default;}
.tb-user{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:10px;border-left:1px solid var(--glass-b);}
.tb-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--glass-b);}

/* Nenhum slide rola — é apresentação, não página de admin (pedido direto:
   "tem que ser one page view"). Quando o conteúdo não cabe, o próprio JS
   (fitSlideContent()) encolhe a slide inteira (transform:scale) até caber,
   em vez de cortar ou deixar barra de rolagem. */
#slides{position:relative;flex:1;overflow:hidden;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:30px 44px;opacity:0;pointer-events:none;
  transform:translateX(50px);transition:opacity .35s ease,transform .35s ease;overflow:hidden;}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0);}
.slide.prev{transform:translateX(-50px);}
.slide-inner{max-width:1300px;margin:0 auto;width:100%;transform-origin:top center;}

#bottombar{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;height:40px;flex-shrink:0;
  background:rgba(3,13,26,.75);backdrop-filter:blur(12px);border-top:1px solid var(--glass-b);}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .25s;}
.dot.active{background:var(--accent);transform:scale(1.4);}
.dot:hover{background:var(--txt2);}

/* ── Cover ── */
.cover-wrap{margin:auto;text-align:center;transform-origin:center center;}
.cover-ico{font-size:68px;margin-bottom:12px;}
.cover-title{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
.cover-sub{font-size:18px;color:var(--txt2);margin-bottom:42px;}
.stat-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.stat-chip{background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:24px 32px;min-width:150px;
  backdrop-filter:blur(12px);}
.stat-chip b{display:block;font-family:'Syne',sans-serif;font-weight:800;font-size:36px;margin-bottom:6px;}
.stat-chip span{font-size:14px;color:var(--txt2);}
.cover-updated{margin-top:36px;font-size:13px;color:var(--txt3);}

/* ── Gerência slide ── */
.ger-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-shrink:0;}
.ger-header .ico{font-size:40px;}
.ger-header h2{font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:800;}
.ger-count{font-size:14px;background:var(--glass);border:1px solid var(--glass-b);border-radius:999px;padding:5px 18px;color:var(--cyan);}
.obj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:24px;}
.obj-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:24px 26px;
  backdrop-filter:blur(14px);cursor:pointer;transition:transform .15s,background .15s;border-left-width:5px;border-left-style:solid;}
.obj-card:hover{transform:translateY(-3px);background:var(--glass-hover);}
.obj-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.status-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;color:var(--txt2);}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.obj-trims{display:flex;gap:6px;flex-wrap:wrap;}
.pill{font-size:12px;background:rgba(255,255,255,.06);border:1px solid var(--glass-b);border-radius:999px;padding:3px 11px;color:var(--txt2);}
.obj-title{font-family:'Syne',sans-serif;font-weight:700;font-size:21px;line-height:1.3;margin-bottom:6px;}
.obj-pilar{font-size:13.5px;color:var(--txt3);font-style:italic;margin-bottom:14px;}
.prog-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:8px;}
.prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--accent));}
.prog-label{font-size:12.5px;color:var(--txt3);margin-bottom:14px;}
.obj-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.tag-chip{font-size:12.5px;border-radius:999px;padding:3px 13px;border:1px solid;}
.obj-bottom{display:flex;justify-content:flex-end;}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-b);background:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-left:-9px;overflow:hidden;}
.avatar:first-child{margin-left:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}

/* ── Summary ── */
.sum-title{font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:800;margin-bottom:32px;}
.sum-bars{display:flex;flex-direction:column;gap:18px;margin-bottom:44px;max-width:860px;}
.sum-bar-row{display:flex;align-items:center;gap:14px;}
.sum-bar-label{width:200px;font-size:16px;color:var(--txt2);flex-shrink:0;display:flex;align-items:center;gap:9px;}
.sum-bar-track{flex:1;height:22px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden;}
.sum-bar-fill{height:100%;border-radius:10px;transition:width .4s ease;}
.sum-bar-count{width:46px;text-align:right;font-family:'Syne',sans-serif;font-weight:700;font-size:18px;flex-shrink:0;}
.sum-table{width:100%;max-width:1050px;border-collapse:collapse;font-size:15px;}
.sum-table th{text-align:left;color:var(--txt3);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.04em;padding:9px 14px;border-bottom:1px solid var(--glass-b);}
.sum-table td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.05);}
.sum-table tr:last-child td{border-bottom:none;}

/* ── Empty state ── */
.empty-state{margin:auto;text-align:center;color:var(--txt2);}
.empty-state .ico{font-size:42px;margin-bottom:12px;}

/* ── Detail — layout de 1 página só (mesmo espírito do modelo-fonte em PDF/
   slide que deu origem ao OKR: título + legenda de status + 2 colunas
   (campos do Objetivo à esquerda, tabela de Marcos à direita) + tira de
   4 colunas embaixo (Progressos/Próximos Passos/Riscos/Planos de Ação).
   Cada painel tem ALTURA NATURAL (auto) — nada de overflow:hidden/máscara
   individual, que cortava conteúdo no meio da linha e deixava painéis
   vazios esticados sem necessidade (achado real, print do usuário: "tem
   conteúdo cortado, outros esticados").
   Encolhimento por SEÇÃO, não no bloco inteiro (achado real, 3ª rodada de
   print do usuário: um único fit no #d2-wrap inteiro deixava TUDO
   minúsculo — cabeçalho, indicadores curtos, rodapé — só porque a tabela
   de Marcos, bem maior que o normal, puxava o encolhimento junto; "as
   outras estão minúsculas" à toa). Cada seção que pode crescer demais
   (tabela de Marcos, Indicadores de Entrega, cada coluna do rodapé) ajusta
   a PRÓPRIA fonte via _okrFitDetailSections() (JS), dentro do espaço que o
   layout (flex/grid) já reserva pra ela — nunca corta, só reduz
   proporcionalmente, e só a seção que realmente precisa. */
#detail-ov{position:fixed;inset:0;z-index:400;display:none;
  background:radial-gradient(ellipse at 20% 80%,rgba(0,80,160,.4) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(0,150,180,.25) 0%,transparent 55%),#010810;}
#detail-ov.open{display:block;}
.detail-modal{position:absolute;inset:0;overflow:hidden;padding:34px 46px;}

.d2-wrap{height:100%;display:flex;flex-direction:column;gap:16px;min-height:0;transform-origin:top center;}
/* Header em grid real (não position:fixed) — título, trimestre e marca/fechar
   nunca se sobrepõem porque cada um tem sua própria coluna garantida. */
.d2-header{display:grid;grid-template-columns:1fr auto auto;align-items:start;gap:20px;flex-shrink:0;}
.d2-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.d2-trim{display:flex;gap:7px;flex-wrap:wrap;align-content:flex-start;justify-content:flex-end;padding-top:5px;max-width:170px;}
.d2-brand-row{display:flex;align-items:center;gap:13px;padding-top:5px;}
.d2-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--txt2);white-space:nowrap;
  display:flex;align-items:center;gap:8px;}
.detail-close{background:var(--glass);border:1px solid var(--glass-b);border-radius:10px;width:32px;height:32px;
  color:var(--txt2);font-size:16px;cursor:pointer;flex-shrink:0;}
.detail-close:hover{background:var(--glass-hover);}

.d2-legend{display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--txt2);flex-shrink:0;}
.d2-legend span{display:flex;align-items:center;gap:8px;}

/* Corpo: rail (Objetivo/Responsável/Indicadores) + tabela de Marcos. Altura
   generosa mas ainda flexível (flex:1;min-height:0) — o rodapé (tira de 4
   colunas) é flex-shrink:0, então o corpo sempre cede espaço a ele
   primeiro.
   Achado real, 2 rodadas de print do usuário: a 1ª versão daqui (SEM
   min-height:0) deixava um Objetivo com muitos marcos empurrar o d2-wrap
   inteiro pra além de 100%, acionando um encolhimento GLOBAL (fonte de
   TUDO — inclusive o rodapé e os indicadores, que tinham conteúdo curto e
   cabiam à vontade) só porque a tabela de Marcos precisava de mais espaço
   ("as outras estão minúsculas" à toa). O ajuste fino agora é LOCAL, não
   global (ver comentário de _okrFitDetailSections() mais abaixo no JS): cada
   seção que pode crescer muito (a tabela de Marcos, os Indicadores de
   Entrega) encolhe só a PRÓPRIA fonte, dentro do espaço que sobrar pra
   ela — o resto do layout (cabeçalho, legenda, rodapé, campos curtos)
   continua no tamanho normal. Por isso min-height:0 volta aqui: o corpo
   PRECISA poder ser espremido pelo layout externo (senão nunca sobra
   menos espaço pra tabela de Marcos precisar encolher) — só que agora,
   em vez de silenciar o corte (que era o bug original, antes de existir
   qualquer mecanismo de fit), cada seção internamente comprimida se
   ajusta sozinha via _okrFitDetailSections(). */
.d2-body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:300px 1.5fr;gap:20px;}
.d2-left{display:flex;flex-direction:column;gap:12px;min-height:0;}
.d2-panel{background:var(--glass);border:1px solid var(--glass-b);border-radius:16px;padding:14px 18px;
  backdrop-filter:blur(12px);}
/* SEM overflow:hidden aqui de propósito (agora que .d2-body voltou a ter
   min-height:0, achado real repetido do Round 1): com overflow!=visible,
   o navegador zera a contribuição de tamanho MÍNIMO deste item pro
   grid/flex — ele fica livre pra ser espremido bem menor que o conteúdo
   precisa ANTES mesmo do _okrFitDetailSections() ter a chance de medir/reagir
   (a medição roda sobre o clientHeight JÁ espremido, então nunca vê o
   déficit de verdade). Sem overflow:hidden, o painel mantém seu tamanho
   mínimo real na conta do layout, e _okrFitDetailSections() consegue medir e
   encolher a fonte certinho quando precisa. */
.d2-panel.grow{flex:1;min-height:0;display:flex;flex-direction:column;}
.d2-panel-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3);font-weight:700;margin-bottom:7px;flex-shrink:0;}
.d2-panel-body{font-size:14px;color:var(--txt2);line-height:1.55;}

/* Mesmo motivo do .d2-panel.grow acima. */
.d2-right{background:var(--glass);border:1px solid var(--glass-b);border-radius:16px;padding:16px 22px;
  backdrop-filter:blur(12px);display:flex;flex-direction:column;min-height:0;}
.d2-table-header{display:flex;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3);
  font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--glass-b);flex-shrink:0;}
.d2-table-header .c-nome{flex:1;}
.d2-table-header .c-status{width:160px;}
.d2-table-header .c-prazo{width:95px;text-align:right;}
.d2-table-rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;}
.d2-marco-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px;}
.d2-marco-row:last-child{border-bottom:none;}
.d2-marco-num{width:22px;color:var(--txt3);font-size:12.5px;flex-shrink:0;}
/* Nome do marco em 1 linha só (nowrap+ellipsis, title="" pro texto completo no
   hover) — é isso que sustenta uma tabela DENSA (7+ marcos) legível sem cada
   nome disputar 2 linhas de altura (achado real: nome longo quebrando em 2
   linhas empurrava o resto do conteúdo pra fora da tela). */
.d2-marco-nome{flex:1;color:var(--txt);padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;}
.d2-marco-status{width:160px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--txt2);flex-shrink:0;}
.d2-marco-prazo{width:95px;text-align:right;font-size:13px;color:var(--txt3);flex-shrink:0;}

/* Tira de 4 colunas — Progressos/Próximos Passos/Riscos/Planos de Ação, na
   MESMA tela do Objetivo (nunca uma 2ª tela — pedido direto: "é importante
   que seja 1 só pra pessoa poder falar dele em um slide só"). Conteúdo de
   cada card fica CENTRALIZADO verticalmente: quando o objetivo tem poucos
   itens, o espaço sobrando vira respiro em volta do texto, não uma caixa
   vazia largada no topo (achado real, print do usuário: "olha o espaço
   vazio! aproveita melhor o espaço").
   flex:1 1 auto;min-height:0 (NÃO flex-shrink:0) de propósito — achado
   real, print do usuário rindo do resultado ("aumentou o espaço
   desproporcional, a letra ficou minúscula"): com o rodapé protegido
   (flex-shrink:0, nunca cede espaço), um Objetivo com rodapé de conteúdo
   real (frases inteiras, não só 1-2 palavras) tomava sozinho a maior
   parte da altura disponível, sobrando quase nada pra Marcos/raia
   esquerda — o TEXTO delas ficava minúsculo tentando caber num espaço
   injustamente pequeno, enquanto o rodapé ficava enorme e intocado. Sem
   flex-shrink:0, o rodapé passa a dividir o mesmo aperto proporcionalmente
   com o corpo (.d2-body) quando o total não cabe — cada seção que estoura
   (rodapé incluído, via _okrFitDetailSections() nas colunas) encolhe a
   própria fonte igual as outras, em vez de uma ficar sempre intocada à
   custa das demais. */
.d2-footer{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;flex:1 1 auto;min-height:0;}
/* SEM overflow:hidden aqui (mesmo motivo do .d2-right/.d2-panel.grow mais
   acima): agora que .d2-footer também é compressível (flex:1;min-height:0,
   ver comentário lá em cima), overflow:hidden zeraria a contribuição
   mínima desta coluna pro grid, deixando-a ser espremida antes do
   _okrFitDetailSections() ter a chance de medir/reagir. */
.d2-fcol{background:var(--glass);border:1px solid var(--glass-b);border-radius:16px;padding:16px 18px;
  backdrop-filter:blur(12px);display:flex;flex-direction:column;}
.d2-fcol h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--cyan);margin-bottom:8px;
  display:flex;align-items:center;gap:7px;flex-shrink:0;}
/* min-height:0 é o que permite _okrFitDetailSections() medir o espaço de
   verdade disponível pra essa lista: sem ele, o item de flex nunca é
   comprimido abaixo do próprio tamanho natural (min-content), então
   clientHeight sempre reporta "do tamanho que eu quero", nunca "do
   tamanho que sobrou" — e a lista passa a vazar visualmente pra fora do
   painel/coluna quando o conteúdo não cabe no espaço reservado (achado
   real, print do usuário: "Indicadores de Entrega" com 6 itens perdendo o
   último item, escondido fora da borda do card, sem nenhum overflow:hidden
   pra sequer escondê-lo — só ficava fora de vista). */
.d2-flist{list-style:none;font-size:14px;color:var(--txt2);line-height:1.65;margin:0;padding:0;
  flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.d2-flist li{padding-left:13px;position:relative;}
.d2-flist li::before{content:'•';position:absolute;left:0;color:var(--txt3);}
.d2-empty{font-size:12.5px;color:var(--txt3);font-style:italic;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px;}
</style>
</head>
<body>

<div class="ocean"></div>

<div id="login-ov">
  <div class="login-card">
    <div class="ico">🎯</div>
    <h1>Apresentação OKR</h1>
    <p>Painel ao vivo dos Objetivos estratégicos, agrupado por gerência. Entre com sua conta @ciahering.com.br pra ver os dados.</p>
    <button class="g-btn" id="login-btn" onclick="window._doLogin()">

function okrStatusInfo(id){ return OKR_STATUS.find(s=>s.id===id) || OKR_STATUS[0]; }
function okrGerenciaLabel(id){ return OKR_GERENCIAS.find(g=>g.id===id)?.label || id || '—'; }
function _okrTrimestresOf(o){
  if(!o) return [];
  if(Array.isArray(o.trimestres) && o.trimestres.length) return o.trimestres;
  return o.trimestre ? [o.trimestre] : [];
}
const PT_PALETTE=[
  {bg:'rgba(56,182,255,.15)',b:'rgba(56,182,255,.35)',c:'#38b6ff'},
  {bg:'rgba(29,233,182,.12)',b:'rgba(29,233,182,.3)',c:'#1de9b6'},
  {bg:'rgba(255,209,102,.12)',b:'rgba(255,209,102,.3)',c:'#ffd166'},

];

let okrObjetivos = {}, okrMarcos = {}, okrTags = {}, usersCache = {};
let _loaded = {obj:false, marco:false, tag:false, users:false};
let _lastUpdate = null;

function pessoaInfo(uid){
  const u = usersCache[uid] || {};
  return {uid, nome:u.nome||u.email||uid, init:u.init||'', foto:u.foto||''};
}
function avatarHtml(uid){
  const p = pessoaInfo(uid);
  const img = safeUrl(p.foto) ? `<img src="${safeUrl(p.foto)}" alt="">` : esc((p.init||p.nome.slice(0,2)).toUpperCase());
  return `<span class="avatar" title="${esc(p.nome)}">${img}</span>`;
}
function objMarcos(objId){ return Object.values(okrMarcos).filter(m=>m && m.objetivoId===objId && !m.arquivado); }
function objStatus(objId){
  const marcos = objMarcos(objId);
  if(!marcos.length) return 'nao_iniciado';
  const ativos = marcos.filter(m=>m.progresso!=='concluido');
  if(!ativos.length) return 'concluido';
  for(const sev of OKR_SEVERIDADE){ if(ativos.some(m=>(m.progresso||'nao_iniciado')===sev)) return sev; }
  return 'nao_iniciado';
}
function objProgressoPct(objId){
  const marcos = objMarcos(objId);
  if(!marcos.length) return 0;
  return Math.round(marcos.filter(m=>m.progresso==='concluido').length / marcos.length * 100);
}

        </div>`});
    });

    // Summary
    const total = ativos.length || 1;
    const barsHtml = OKR_STATUS.map(s=>{
      const n = counts[s.id]||0, pct = Math.round(n/total*100);
      return `<div class="sum-bar-row">
        <div class="sum-bar-label"><span class="status-dot" style="background:${s.dot};"></span>${esc(s.label)}</div>
        <div class="sum-bar-track"><div class="sum-bar-fill" style="width:${pct}%;background:${s.dot};"></div></div>
        <div class="sum-bar-count">${n}</div>
      </div>`;
    }).join('');
    const tableRows = OKR_GERENCIAS.filter(g=>porArea[g.id]?.length).map(g=>{
      const lista = porArea[g.id];
      const c = {nao_iniciado:0,no_prazo:0,risco:0,atrasado:0,concluido:0};
      lista.forEach(o=>{ c[objStatus(o.id)]=(c[objStatus(o.id)]||0)+1; });
      return `<tr><td>${g.icon} ${esc(g.label)}</td><td>${lista.length}</td>
        <td style="color:var(--teal);">${c.no_prazo}</td><td style="color:var(--warn);">${c.risco}</td>
        <td style="color:var(--danger);">${c.atrasado}</td><td style="color:var(--accent);">${c.concluido}</td></tr>`;
    }).join('');

      <div class="slide-inner">

        <div class="sum-bars">${barsHtml}</div>
        <table class="sum-table"><thead><tr><th>Gerência</th><th>Ativos</th><th>No prazo</th><th>Risco</th><th>Atrasado</th><th>Concluído</th></tr></thead>
        <tbody>${tableRows}</tbody></table>

  }

  return list;
}

function scheduleRebuild(){
  clearTimeout(scheduleRebuild._t);
  scheduleRebuild._t = setTimeout(rebuild, 150);
}
function rebuild(){
  if(!Object.values(_loaded).every(Boolean)) return;
  const prevKey = slides[currentIdx]?.key;
  slides = buildSlides();
  _lastUpdate = new Date();
  let idx = slides.findIndex(s=>s.key===prevKey);
  currentIdx = idx>=0 ? idx : 0;
  render();
}

// Nunca deixa uma slide precisar de scroll (pedido direto: "tem que ser one
// page view, é uma apresentação"). Em vez de cortar conteúdo, encolhe até
// caber no espaço disponível — só entra em ação quando o conteúdo
// realmente não cabe (poucos Objetivos numa gerência renderiza em tamanho
// normal/grande).
//
// Achado real (2 rodadas de print do usuário): a 1ª versão disso usava
// transform:scale(fator) no bloco inteiro — encolhe altura E largura pelo
// MESMO fator, pra manter a proporção. Só que largura quase nunca é o
// problema aqui (o conteúdo já ocupa ~100% da largura disponível antes de
// qualquer encolhimento); é praticamente sempre só a ALTURA que estoura.
// Resultado: o fator ficava definido pela altura (a dimensão realmente
// apertada), e esse MESMO fator pequeno também encolhia a largura, que já
// cabia — sobrava um respiro enorme nas laterais ("sobra espaço vazio que
// podia ser usado") e a fonte ficava menor do que precisava
// ("texto muito pequeno"), porque a largura nunca foi de fato reduzida.
//
// Fix: troca transform:scale por zoom + largura compensada
// (width:(100/zoom)%). zoom, diferente de transform, dispara reflow de
// verdade — o texto quebra linha considerando a largura já compensada
// (ou seja, a largura VISUAL final continua ocupando 100% do espaço
// disponível, só a fonte/paddings encolhem). Como menos zoom = texto
// quebrando em MAIS linhas por parágrafo mas cada linha mais estreita (não
// dá pra prever a altura final por uma conta linear simples), faz busca
// binária: tenta um nível de zoom, mede a altura resultante de verdade
// (getBoundingClientRect, já com o reflow aplicado) e ajusta até achar o
// MAIOR zoom que ainda cabe — a fonte fica exatamente do tamanho que sobra
// o mínimo de espaço, nunca menor que o necessário.
//
// Duas pegadinhas reais do CSS `zoom` que já derrubaram uma 1ª tentativa
// desta função (media explodindo pra 10x/100x do esperado, testado com
// Playwright antes de subir): (1) `scrollHeight`/`scrollWidth` lidos DE
// DENTRO de um elemento com zoom aplicado retornam no sistema de
// coordenadas LOCAL dele (como se o zoom não existisse por dentro) — pra
// comparar com a altura disponível de verdade (medida por FORA, no
// container sem zoom), tem que usar getBoundingClientRect(), que sempre
// reporta em pixels físicos/reais. (2) `width` em PORCENTAGEM num elemento
// com zoom resolve contra containingBlockWidth/zoom (maior quanto menor o
// zoom) — combinado com a compensação `100/zoom`, isso vira uma conta ao
// quadrado (cresce descontroladamente a cada iteração). Usar `px`
// absoluto (não `%`) pra largura evita essa composição.
// Núcleo compartilhado: encolhe `content` (zoom + largura compensada em px)
// até sua altura renderizada caber em `availH`, sem nunca deixar a largura
// visual sair de `content`'s largura natural (targetW) — só a fonte
// encolhe, a largura continua ocupando o espaço todo. Usado tanto pro
// encolhimento de UMA seção específica (_okrFitDetailSections) quanto pro
// encolhimento do bloco inteiro (fitSlideContent, carrossel de slides).
function _zoomFitToHeight(content, availH){
  content.style.zoom = '';
  content.style.width = '';
  content.style.height = '';
  content.style.flex = '';
  content.style.alignSelf = '';
  if(!availH) return;
  // scrollHeight continua confiável aqui (zoom:1, sem override de height):
  // revela o overflow de verdade mesmo o content tendo height:100% no CSS.
  if(content.scrollHeight <= availH) return; // já cabe no tamanho normal, não mexe

  // Achado real (print do usuário: tabela de Marcos indo pro MENOR zoom
  // permitido, 0.15, mesmo bastando um encolhimento leve): setar
  // height:auto NÃO basta quando content ainda é esticado pelo layout do
  // PAI — se o pai for flex (ex.: .d2-table-rows dentro de .d2-right), o
  // algoritmo de flexbox continua prendendo a altura no espaço que o
  // container reservou (flex-grow), ignorando o height:auto; se o pai for
  // grid (ex.: .d2-left dentro de .d2-body), quem prende é o
  // align-self:stretch padrão de todo item de grid — MESMO bug, mecanismo
  // diferente (achado 2x: 1ª vez em .d2-table-rows via flex-grow, 2ª vez
  // em .d2-left via align-self — a medição ficava travada sempre no MESMO
  // número, então a busca binária nunca via "já coube" e ia direto pro
  // piso do intervalo). flex:none + align-self:start desligam os dois
  // tipos de esticamento — só então o height:auto reflete o tamanho
  // NATURAL do conteúdo, que é o que precisa ser medido a cada zoom.
  content.style.flex = 'none';
  content.style.alignSelf = 'start';
  content.style.height = 'auto';
  const targetW = content.getBoundingClientRect().width; // largura real a manter em qualquer nível de zoom
  let lo = 0.15, hi = 1;
  for(let i=0;i<16;i++){
    const mid = (lo+hi)/2;
    content.style.zoom = mid;
    content.style.width = (targetW/mid)+'px';
    if(content.getBoundingClientRect().height <= availH) lo = mid; else hi = mid;
  }
  content.style.zoom = lo;
  content.style.width = (targetW/lo)+'px';
}

// Nunca deixa uma slide precisar de scroll (pedido direto: "tem que ser one
// page view, é uma apresentação"). Em vez de cortar conteúdo, encolhe até

// realmente não cabe (poucos Objetivos numa gerência renderiza em tamanho
// normal/grande). Usado no carrossel de slides (.slide/.slide-inner), cujo
// conteúdo (grid de cards) não tem a mesma composição "seção pequena ao
// lado de seção grande" do detalhe do Objetivo — ali um único fit no bloco
// inteiro é suficiente (ver _okrFitDetailSections() logo abaixo pro caso que
// precisa de ajuste por seção).
//
// Achado real (2 rodadas de print do usuário): a 1ª versão disso usava
// transform:scale(fator) no bloco inteiro — encolhe altura E largura pelo
// MESMO fator, pra manter a proporção. Só que largura quase nunca é o
// problema aqui (o conteúdo já ocupa ~100% da largura disponível antes de
// qualquer encolhimento); é praticamente sempre só a ALTURA que estoura.
// Resultado: o fator ficava definido pela altura (a dimensão realmente
// apertada), e esse MESMO fator pequeno também encolhia a largura, que já
// cabia — sobrava um respiro enorme nas laterais ("sobra espaço vazio que
// podia ser usado") e a fonte ficava menor do que precisava
// ("texto muito pequeno"), porque a largura nunca foi de fato reduzida.
//
// Fix: troca transform:scale por zoom + largura compensada em px (ver
// _zoomFitToHeight acima) — zoom, diferente de transform, dispara reflow
// de verdade, então o texto quebra linha considerando a largura já

// disponível, só a fonte/paddings encolhem).
//
// Duas pegadinhas reais do CSS `zoom` que já derrubaram uma 1ª tentativa
// desta função (medida explodindo pra 10x/100x do esperado, testado com
// Playwright antes de subir): (1) `scrollHeight`/`scrollWidth` lidos DE
// DENTRO de um elemento com zoom aplicado retornam no sistema de
// coordenadas LOCAL dele (como se o zoom não existisse por dentro) — pra
// comparar com a altura disponível de verdade (medida por FORA, no
// container sem zoom), tem que usar getBoundingClientRect(), que sempre
// reporta em pixels físicos/reais. (2) `width` em PORCENTAGEM num elemento
// com zoom resolve contra containingBlockWidth/zoom (maior quanto menor o
// zoom) — combinado com a compensação `100/zoom`, isso vira uma conta ao
// quadrado (cresce descontroladamente a cada iteração). Usar `px`
// absoluto (não `%`) pra largura evita essa composição.
function fitSlideContent(containerEl, contentEl){
  if(!containerEl) return;
  const content = contentEl || containerEl.firstElementChild;
  if(!content) return;
  const cs = getComputedStyle(containerEl);
  const padY = parseFloat(cs.paddingTop||0) + parseFloat(cs.paddingBottom||0);
  _zoomFitToHeight(content, containerEl.clientHeight - padY);
}

// Ajuste por seção do detalhe do Objetivo (tabela de Marcos, raia
// esquerda, cada coluna do rodapé) — nunca o bloco inteiro. Achado real
// (print do usuário, depois de fitSlideContent() já ter corrigido corte e
// desperdício de largura): um Objetivo com muitos marcos ainda deixava
// TUDO minúsculo — cabeçalho, indicadores curtos, rodapé com listas de
// 1-2 itens — só porque a tabela de Marcos, bem maior que o normal,
// empurrava o encolhimento pro d2-wrap INTEIRO ("as outras estão
// minúsculas" à toa, sobrando espaço perfeitamente utilizável nas seções
// pequenas). Cada `el` já é um item flex/grid com `min-height:0` dentro
// de um pai com altura fixa (a própria estrutura garante isso — ver
// .d2-table-rows/.d2-left/.d2-flist no CSS) — ou seja, `el.clientHeight`
// (medido ANTES de qualquer ajuste, ver _okrFitDetailSections() logo
// abaixo pro motivo de medir tudo de uma vez) já é exatamente o espaço
// que o layout externo reservou pra essa seção.

function render(){
  const wrap = document.getElementById('slides');
  wrap.innerHTML = slides.map((s,i)=>`<div class="slide${i===currentIdx?' active':(i<currentIdx?' prev':'')}" data-idx="${i}">${s.html}</div>`).join('');
  document.getElementById('bottombar').innerHTML = slides.map((s,i)=>
    `<span class="dot${i===currentIdx?' active':''}" onclick="window._okrGoTo(${i})" title="${esc(s.title)}"></span>`).join('');
  document.getElementById('tb-title').textContent = slides[currentIdx]?.title || '—';
  document.getElementById('tb-bar-fill').style.width = slides.length ? ((currentIdx+1)/slides.length*100)+'%' : '0%';
  document.getElementById('btn-prev').disabled = currentIdx<=0;
  document.getElementById('btn-next').disabled = currentIdx>=slides.length-1;
  const upd = document.getElementById('cover-updated');
  if(upd && _lastUpdate) upd.textContent = '🔄 Atualizado às ' + _lastUpdate.toLocaleTimeString('pt-BR');
  fitSlideContent(document.querySelector('.slide.active'));
}
window.addEventListener('resize', () => fitSlideContent(document.querySelector('.slide.active')));

// Achado real (print do usuário, conteúdo cortado mesmo com fitSlideContent no
// lugar): a 1ª medição roda ANTES da webfont (Syne/DM Sans, carregada via
// Google Fonts com display=swap) terminar de carregar — o texto reflui pro
// tamanho real da fonte um instante depois, ficando maior que o medido, e por
// aí passa a cortar sem ninguém ter reencolhido. document.fonts.ready garante
// 1 remedida depois que a fonte troca de verdade.
document.fonts?.ready?.then(() => {
  fitSlideContent(document.querySelector('.slide.active'));
  if(document.getElementById('detail-ov')?.classList.contains('open')){
    _okrFitDetailSections();
  }
});

window._okrGoTo = i => { if(i>=0 && i<slides.length){ currentIdx=i; render(); } };
window._okrNext = () => window._okrGoTo(currentIdx+1);
window._okrPrev = () => window._okrGoTo(currentIdx-1);
window._okrFullscreen = () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

document.addEventListener('keydown', e=>{
  if(document.getElementById('detail-ov').classList.contains('open')){
    if(e.key==='Escape' || e.key==='Backspace'){ e.preventDefault(); window._okrCloseDetail(); }
    return;
  }
  if(e.key==='ArrowRight' || e.key===' ') window._okrNext();
  else if(e.key==='ArrowLeft') window._okrPrev();
  else if(e.key.toLowerCase()==='f') window._okrFullscreen();
});

// ── Modal de detalhe (drill-down de um Objetivo) — layout de 1 página só,
// no mesmo espírito do modelo-fonte (título + legenda + 2 colunas + tira de
// 4 colunas embaixo), ver CSS .d2-* acima. ──
function d2FieldList(arr){
  if(!arr || !arr.length) return '<div class="d2-empty" style="flex:1;min-height:0;display:flex;align-items:center;">Nada registrado ainda.</div>';
  return `<ul class="d2-flist">${arr.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`;
}
window._okrOpenDetail = id => {
  const o = okrObjetivos[id]; if(!o) return;
  const st = okrStatusInfo(objStatus(id));
  const marcos = objMarcos(id).sort((a,b)=>(a.prazo||'').localeCompare(b.prazo||''));
  document.getElementById('detail-modal').innerHTML = `
    <div class="d2-wrap" id="d2-wrap">
      <div class="d2-header">
        <div class="d2-title">${esc(o.titulo||'—')}</div>
        <div class="d2-trim">${_okrTrimestresOf(o).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>
        <div class="d2-brand-row">
          <div class="d2-brand">🎯 ${esc(okrGerenciaLabel(o.areaId))}</div>
          <button class="detail-close" onclick="window._okrCloseDetail()">✕</button>
        </div>
      </div>
      <div class="d2-legend">
        ${OKR_STATUS.filter(s=>s.id==='no_prazo'||s.id==='risco'||s.id==='atrasado').map(s=>`<span><span class="status-dot" style="background:${s.dot};"></span>${esc(s.label)}</span>`).join('')}
      </div>
      <div class="d2-body">
        <div class="d2-left">
          ${o.pilar?`<div class="d2-panel"><div class="d2-panel-label">Pilar Estratégico</div><div class="d2-panel-body">${esc(o.pilar)}</div></div>`:''}
          <div class="d2-panel"><div class="d2-panel-label">🎯 Objetivo</div><div class="d2-panel-body">${esc(o.descricao||'—')}</div></div>
          <div class="d2-panel"><div class="d2-panel-label">👤 Responsável(is)</div><div class="d2-panel-body" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${(o.responsaveis||[]).length?o.responsaveis.map(uid=>avatarHtml(uid)).join(''):'<span class="d2-empty">Nenhum responsável definido.</span>'}</div></div>
          <div class="d2-panel grow"><div class="d2-panel-label">Indicadores de Entrega</div>${d2FieldList(o.indicadores)}</div>
        </div>
        <div class="d2-right">
          <div class="d2-table-header"><span class="c-nome">Marcos ou atividades macros</span><span class="c-status">Status</span><span class="c-prazo">Prazo</span></div>
          <div class="d2-table-rows">${marcos.length ? marcos.map((m,i)=>{
            const ms=okrStatusInfo(m.progresso);
            return `<div class="d2-marco-row">
              <span class="d2-marco-num">${i+1}.</span>
              <span class="d2-marco-nome" title="${esc(m.nome||'—')}">${esc(m.nome||'—')}</span>
              <span class="d2-marco-status"><span class="status-dot" style="background:${ms.dot};"></span>${esc(ms.label)}</span>
              <span class="d2-marco-prazo">${m.prazo?esc(m.prazo):'—'}</span>
            </div>`;
          }).join('') : '<div class="d2-empty">Nenhum marco cadastrado ainda.</div>'}</div>
        </div>
      </div>
      <div class="d2-footer">
        <div class="d2-fcol"><h4>→ Progressos</h4>${d2FieldList(o.progressos)}</div>
        <div class="d2-fcol"><h4>🕐 Próximos Passos</h4>${d2FieldList(o.proximosPassos)}</div>
        <div class="d2-fcol"><h4>⚠️ Riscos</h4>${d2FieldList(o.riscos)}</div>
        <div class="d2-fcol"><h4>🧮 Planos de Ação</h4>${d2FieldList(o.planosAcao)}</div>
      </div>
    </div>
  `;
  document.getElementById('detail-ov').classList.add('open');
  _okrFitDetailSections();
};
// Ajusta cada seção independentemente (ver _okrFitDetailSections()) — nunca um
// único fit pro d2-wrap inteiro, senão a tabela de Marcos grande encolhe
// TUDO junto, inclusive seções curtas que cabiam à vontade.
//
// A raia da esquerda (.d2-left) é ajustada INTEIRA, não só o painel de
// Indicadores: achado real, print do usuário com a descrição real do
// Objetivo (~270 caracteres, ocupa boa parte da raia sozinha) — só
// encolher o painel de Indicadores não bastava, porque ele é o ÚLTIMO da
// pilha (Objetivo → Responsável → Indicadores) e os 2 primeiros, sem
// nenhum ajuste, comiam quase todo o espaço da raia sozinhos, deixando
// Indicadores com uma fração ínfima (chegava a ~48px pra uma lista de 6
// itens) — pequeno demais pra caber mesmo no zoom mínimo, vazando por
// cima do rodapé. Encolher a raia INTEIRA junto (Objetivo + Responsável +
// Indicadores) faz os 3 dividirem o mesmo encolhimento proporcional, em
// vez de 2 ficarem intocados e 1 sozinho pagar a conta toda.
//
// Achado real (2ª rodada, print do usuário: rodapé virou gigante e a
// raia/tabela ficaram minúsculas espremidas num canto — literalmente o
// oposto do pedido, MESMO já pré-capturando o orçamento de cada seção
// antes de mexer nela): pré-capturar não bastou porque a divisão externa
// (.d2-body vs .d2-footer, que competem por flex-shrink desde que o
// rodapé também virou compressível — ver comentário do .d2-footer no
// CSS) continuava sendo recalculada AO VIVO a cada mudança — encolher
// .d2-left/.d2-table-rows (flex:none + align-self:start + height:auto)
// muda o tamanho NATURAL de baixo-pra-cima da célula de grid, o que muda
// o flex-basis:auto do PRÓPRIO .d2-body, o que muda quanto o d2-wrap
// externo dá pro corpo vs pro rodapé DEPOIS que a 1ª seção já foi
// ajustada. Fix: trava a divisão body/footer (height explícito em px +
// flex:none nos DOIS) ANTES de tocar em qualquer seção interna — só
// depois disso mede e ajusta cada seção (tabela de Marcos, raia
// esquerda, colunas do rodapé) dentro do espaço já congelado, sem risco
// de a divisão externa se mexer no meio do processo.
function _okrFitDetailSections(){
  const dBody = document.querySelector('.d2-body');
  const dFooter = document.querySelector('.d2-footer');
  dBody.style.flex = ''; dBody.style.height = '';
  dFooter.style.flex = ''; dFooter.style.height = '';
  const dBodyH = dBody.clientHeight, dFooterH = dFooter.clientHeight;
  dBody.style.flex = 'none'; dBody.style.height = dBodyH+'px';
  dFooter.style.flex = 'none'; dFooter.style.height = dFooterH+'px';

  const marcosRows = document.querySelector('.d2-table-rows');
  const dLeft = document.querySelector('.d2-left');
  const fcols = [...document.querySelectorAll('.d2-fcol')];
  // Mesma trava do .d2-left acima: cada coluna do rodapé também é célula
  // de grid (align-self:stretch por padrão) — travar só a altura do
  // .d2-footer não impede uma .d2-fcol de crescer além da linha (CSS Grid
  // não limita o tamanho "auto" de uma célula pelo tamanho do container,
  // achado real: rodapé travado em 227px, mas uma coluna sozinha
  // renderizava 374px, vazando 147px pra fora do próprio rodapé). Trava
  // cada fcol na MESMA altura do rodapé já travado, do mesmo jeito.
  fcols.forEach(fcol=>{ fcol.style.alignSelf = 'start'; fcol.style.height = dFooterH+'px'; });
  const fcolLists = fcols.map(fcol=>fcol.querySelector('.d2-flist, .d2-empty'));

  const availMarcos = marcosRows.clientHeight;
  const availLeft = dLeft.clientHeight;
  const availFcols = fcolLists.map(el=>el ? el.clientHeight : 0);

  _zoomFitToHeight(marcosRows, availMarcos);
  _zoomFitToHeight(dLeft, availLeft);
  fcolLists.forEach((el,i)=>{ if(el) _zoomFitToHeight(el, availFcols[i]); });
}
window._okrCloseDetail = () => document.getElementById('detail-ov').classList.remove('open');

// ── Clock ──
setInterval(()=>{
  document.getElementById('tb-clock').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}, 1000);

// ── Auth / data lifecycle ──
let listenersStarted = false;
function startListeners(){
  if(listenersStarted) return;
  listenersStarted = true;
  const onErr = err => {
    document.getElementById('login-ov').hidden = false;
    document.getElementById('app').hidden = true;
    const el = document.getElementById('login-err');
    el.textContent = '⚠️ Sua conta entrou, mas não tem permissão pra ver os dados de OKR (precisa ser @ciahering.com.br ou ter acesso liberado no painel).';
    el.hidden = false;
    document.getElementById('login-out-btn').hidden = false;
  };
  window._onValue(window._ref(window._db,'kanban/okr/objetivos'), snap=>{ okrObjetivos = snap.val()||{}; _loaded.obj=true; scheduleRebuild(); }, onErr);
  window._onValue(window._ref(window._db,'kanban/okr/marcos'), snap=>{ okrMarcos = snap.val()||{}; _loaded.marco=true; scheduleRebuild(); }, onErr);
  window._onValue(window._ref(window._db,'kanban/okr/tags'), snap=>{ okrTags = snap.val()||{}; _loaded.tag=true; scheduleRebuild(); }, onErr);
  window._onValue(window._ref(window._db,'kanban/usuarios'), snap=>{ usersCache = snap.val()||{}; _loaded.users=true; scheduleRebuild(); }, onErr);
}

window._okrHandleAuth = user => {
  window._currentUser = user||null;
  document.getElementById('login-btn').textContent = 'Entrar com Google';
  if(user){
    document.getElementById('login-ov').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('login-err').hidden = true;
    document.getElementById('login-out-btn').hidden = true;
    if(safeUrl(user.photoURL)) document.getElementById('tb-avatar').src = user.photoURL;
    startListeners();
  } else {
    document.getElementById('login-ov').hidden = false;
    document.getElementById('app').hidden = true;
  }
};
</script>
