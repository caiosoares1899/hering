name: Checks

# Checagem automática em todo PR (e em todo push na main): testes de functions/ (inclui as regras do banco)
# + scripts/checar.js (JSON, versões x HTML, sintaxe das páginas, referências nas docs).
# Existe porque a main já ficou vermelha sem ninguém ver (teste do conhecimento do Agente Ágil) — não havia CI.
# Roda igual na sua máquina: `node scripts/checar.js` e `cd functions && npm test`.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (mesma versão das Cloud Functions)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Checagens do repositório (JSON, versões, sintaxe das páginas, referências)
        run: node scripts/checar.js

      - name: Testes de functions/ (inclui regras do banco)
        working-directory: functions
        run: |
          npm ci
          npm test
