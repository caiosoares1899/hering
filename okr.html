<script>
// Link curto/fácil de compartilhar pro OKR do painel — pedido direto do
// usuário ("n tem como o okr ganhar uma pagina tipo /okr? para facilitar
// o compartilhamento"). Continua exigindo login @ciahering normal, mesma
// tela/permissões de painel.html — isto aqui só encurta o endereço, não
// muda quem pode ver o quê (decisão explícita do usuário, ver conversa).
//
// Repassa TODOS os parâmetros da URL — em especial ?okr=<id>, gerado por
// shareOkrObjLink() em painel.html pra abrir um Objetivo específico
// direto (ver _okrTryOpenFromUrl() lá) — só garantindo tab=okr como
// padrão se nada mais tiver sido passado.
const params = new URLSearchParams(location.search);
if(!params.has('tab')) params.set('tab', 'okr');
location.replace('painel.html?' + params.toString());
</script>
