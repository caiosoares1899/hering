<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 Travessia · Dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon-oceano.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ═══ Travessia — página real da Fase 1 (docs/ideias/travessia-2026-10-22.md §13). Visual herdado do protótipo (docs/demo/travessia-prototipo-fase0.html) ═══
   Sem Firebase, sem login, sem banco: tudo aqui é FICTÍCIO (pessoas, números, datas). Serve para validar a metáfora e o fluxo com POs antes de tocar em regras.
   Marine Glass: mesmos tokens do Oceano (abrolhos = escuro, lencois = claro, entardecer). Estado nunca só pela cor (cor + ícone + texto). */
:root{
  --deep:#030d1a;--deep-rgb:3,13,26;--glass:rgba(10,37,64,0.74);--glass-b:rgba(56,182,255,0.3);--glass-h:rgba(56,182,255,0.12);
  --accent:#38b6ff;--cyan:#7ec8e3;--teal:#1de9b6;
  --txt:#e8f4fd;--txt2:rgba(200,230,255,0.78);--txt3:rgba(150,200,240,0.6);
  --warn:#ffd166;--danger:#ff6b6b;--ok:#4ade80;--r:10px;--r2:14px;
  --surface-rgb:10,30,55;--surface2-rgb:6,22,40;--ink-rgb:3,13,26;--on-accent:#04141f;
  --ok-bg:rgba(74,222,128,.18);--warn-bg:rgba(255,209,102,.18);--bad-bg:rgba(255,107,107,.2);--ag-bg:rgba(56,182,255,.18);
  --ff-d:'Syne','DM Sans',sans-serif;--ff:'DM Sans',system-ui,sans-serif;--shadow:0 10px 34px rgba(0,0,0,.35);
  --ocean:radial-gradient(ellipse at 20% 80%,rgba(0,80,160,.4) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(0,150,180,.25) 0%,transparent 55%),#010810;
}
:root[data-theme="light"]{
  --deep:#0F87C4;--deep-rgb:15,135,196;--glass:rgba(255,255,255,0.72);--glass-b:rgba(0,124,168,0.28);--glass-h:rgba(0,124,168,0.1);
  --accent:#006a9a;--cyan:#065670;--teal:#0a7d75;
  --txt:#0B2436;--txt2:rgba(11,36,54,0.84);--txt3:rgba(11,36,54,0.68);
  --warn:#8a5a00;--danger:#b3261e;--ok:#1a7a44;--surface-rgb:251,253,255;--surface2-rgb:235,245,250;--ink-rgb:251,253,255;--on-accent:#ffffff;
  --ok-bg:rgba(26,122,68,.14);--warn-bg:rgba(138,90,0,.15);--bad-bg:rgba(179,38,30,.12);--ag-bg:rgba(0,106,154,.13);--shadow:0 10px 30px rgba(7,70,110,.22);
  --ocean:radial-gradient(ellipse at 20% 80%,rgba(0,183,180,.30) 0%,transparent 62%),radial-gradient(ellipse at 80% 15%,rgba(0,151,214,.30) 0%,transparent 58%),linear-gradient(175deg,#57C4E0 0%,#0F87C4 100%);
}
:root[data-theme="sunset"]{
  --deep:#1a1530;--deep-rgb:26,21,48;--glass:rgba(38,28,58,0.84);--glass-b:rgba(255,176,110,0.38);--glass-h:rgba(255,176,110,0.14);
  --accent:#ffb36b;--cyan:#ffd2a1;--teal:#ffcf6e;
  --txt:#fdf1e4;--txt2:rgba(253,241,228,0.84);--txt3:rgba(253,241,228,0.66);
  --surface-rgb:48,34,66;--surface2-rgb:34,24,50;--ink-rgb:26,21,48;--on-accent:#2a1405;
  --ok-bg:rgba(74,222,128,.18);--warn-bg:rgba(255,207,110,.2);--bad-bg:rgba(255,120,120,.22);--ag-bg:rgba(255,179,107,.2);
  --ocean:radial-gradient(ellipse 80% 45% at 50% 38%,rgba(255,160,70,.5) 0%,rgba(255,120,60,.16) 45%,transparent 70%),linear-gradient(180deg,#141d3f 0%,#2a2a55 22%,#7a4a56 38%,#d98a58 47%,#1b4a63 48.4%,#0d2f4b 62%,#071c33 100%);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;}
body{font-family:var(--ff);color:var(--txt);background:var(--deep);font-size:14px;line-height:1.45;overflow-x:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;}

/* fundo: camada fixa (mesmo padrão do Oceano) — --ocean é uma lista de camadas e NÃO funciona dentro do atalho `background:` */
.ocean{position:fixed;inset:0;z-index:-3;pointer-events:none;background:var(--ocean);}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:rgba(var(--deep-rgb),.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-b);}
.topo-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;}
:root[data-theme="light"] .topo{background:rgba(255,255,255,.86);}
.logo{font-family:var(--ff-d);font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;}
.proto{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px dashed var(--warn);color:var(--txt);background:rgba(var(--surface-rgb),.7);}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:rgba(var(--surface2-rgb),.75);border:1px solid var(--glass-b);flex-wrap:wrap;}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--txt2);min-height:34px;}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);}
.lbl{font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;}
.topo .sp{flex:1;}
.sel{background:rgba(var(--surface-rgb),.85);border:1px solid var(--glass-b);border-radius:9px;padding:6px 10px;min-height:34px;}

/* vidro */
.gl{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.pad{padding:16px;}
.h1{font-family:var(--ff-d);font-size:24px;font-weight:800;line-height:1.15;}
.h2{font-family:var(--ff-d);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sub{color:var(--txt2);font-size:13px;}
.small{font-size:12px;color:var(--txt2);}
.hero{margin:18px 0 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));}
.stack>*+*{margin-top:12px;}

/* abas */
.tabs{display:flex;gap:4px;margin:14px 0;overflow-x:auto;padding:3px;border-radius:12px;background:rgba(var(--surface2-rgb),.7);border:1px solid var(--glass-b);scrollbar-width:thin;}
.tabs button{flex:none;border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--txt2);min-height:40px;white-space:nowrap;}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(0,0,0,.25);}
.tabs .n{font-size:11px;margin-left:4px;opacity:.85;}

/* botões e chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.8);padding:8px 13px;border-radius:10px;font-weight:700;font-size:13px;min-height:38px;}
.btn:hover{border-color:var(--accent);}
.btn.p{background:linear-gradient(135deg,var(--accent),var(--teal));color:var(--on-accent);border:0;}
.btn.s{padding:4px 10px;min-height:30px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.55;cursor:default;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--glass-b);background:rgba(var(--surface2-rgb),.7);color:var(--txt);white-space:nowrap;}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);} .chip.warn{border-color:var(--warn);background:var(--warn-bg);} .chip.bad{border-color:var(--danger);background:var(--bad-bg);} .chip.ag{border-style:dashed;border-color:var(--accent);background:var(--ag-bg);}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;}
.filtros button{border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.7);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;min-height:34px;color:var(--txt);}
.filtros button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}

/* rota */
.rota{list-style:none;display:flex;gap:0;position:relative;padding:6px 0 0;}
.rota::before{content:"";position:absolute;left:4%;right:4%;top:33px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--glass-b) 0 10px,transparent 10px 16px);}
.porto{flex:1;min-width:0;text-align:center;position:relative;padding:0 4px;}
.porto .pt{width:54px;height:54px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(var(--surface-rgb),.95);border:2px solid var(--glass-b);position:relative;}
.porto.feito .pt{border-color:var(--ok);}
.porto.atual .pt{border-color:var(--accent);box-shadow:0 0 0 4px var(--glass-h);}
.porto .barco{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:22px;animation:bob 2.8s ease-in-out infinite;}
.porto .t{font-size:12.5px;font-weight:700;margin-top:8px;line-height:1.25;}
.porto .d{font-size:11.5px;color:var(--txt2);margin-top:2px;}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0) rotate(0);}50%{transform:translateX(-50%) translateY(-4px) rotate(-6deg);}}
@media (max-width:760px){
  .rota{flex-direction:column;gap:14px;padding-left:4px;}
  .rota::before{left:31px;right:auto;top:20px;bottom:20px;width:4px;height:auto;background:repeating-linear-gradient(180deg,var(--glass-b) 0 10px,transparent 10px 16px);}
  .porto{display:grid;grid-template-columns:62px 1fr;text-align:left;align-items:center;gap:0 6px;padding:0;}
  .porto .pt{margin:0;}
  .porto .barco{top:-14px;left:31px;}
  .porto .t{margin-top:0;}
}

/* anel / barra */
.ring{position:relative;flex:none;width:62px;height:62px;}
.ring svg{display:block;transform:rotate(-90deg);}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.bar{height:8px;border-radius:99px;background:rgba(var(--ink-rgb),.35);overflow:hidden;}
:root[data-theme="light"] .bar{background:rgba(11,36,54,.14);}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--teal));}

/* listas */
.lst{list-style:none;}
.lst li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--glass-b);}
.lst li:last-child{border-bottom:0;}
.lst .tx{flex:1;min-width:0;word-break:break-word;}
.lst .feita{text-decoration:line-through;opacity:.85;}
.cb{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent);}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.foco{padding:14px;border-radius:var(--r2);border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.55);}
.foco-h{display:flex;gap:12px;align-items:center;}
.foco-h .tt{flex:1;min-width:0;font-weight:700;}
.rasc{border-style:dashed;border-color:var(--accent);background:linear-gradient(var(--ag-bg),var(--ag-bg)),rgba(var(--surface-rgb),.55);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.in{flex:1;min-width:160px;background:rgba(var(--surface2-rgb),.8);border:1px solid var(--glass-b);border-radius:10px;padding:9px 12px;min-height:40px;}
textarea.in{width:100%;min-height:92px;resize:vertical;}
.tile{padding:12px;border-radius:12px;border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.55);}
.tile b{display:block;font-family:var(--ff-d);font-size:24px;line-height:1.1;}
.tile span{font-size:12px;color:var(--txt2);}
.vazio{border:1px dashed var(--glass-b);border-radius:12px;padding:16px;text-align:center;color:var(--txt2);font-size:13px;}
.nota{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--accent);background:linear-gradient(var(--ag-bg),var(--ag-bg)),rgba(var(--surface2-rgb),.7);font-size:12.5px;color:var(--txt);}

/* frota */
.pcard{padding:14px;cursor:default;}
.pcard.at{border-left:5px solid var(--warn);}
.pcard .top{display:flex;gap:12px;align-items:center;}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--teal));color:var(--on-accent);}
.strip{display:flex;gap:3px;margin-top:10px;}
.strip i{width:100%;max-width:22px;height:22px;border-radius:5px;border:1px solid var(--glass-b);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;line-height:1;color:var(--txt);background:rgba(var(--surface2-rgb),.6);}
.strip i.d{background:var(--ok);color:var(--on-accent);border-color:var(--ok);}
.strip i.m{border-color:var(--danger);border-width:2px;}
.strip i.r{border-style:dashed;}
.strip i.v{opacity:.55;}
.leg{display:inline-flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt);margin-top:8px;padding:6px 12px;border-radius:10px;background:rgba(var(--surface-rgb),.9);border:1px solid var(--glass-b);}
.leg i{display:inline-flex;width:14px;height:14px;border-radius:3px;border:1px solid var(--glass-b);vertical-align:middle;margin-right:4px;align-items:center;justify-content:center;font-style:normal;font-size:9px;}
.pcard .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(92vw,480px);padding:10px 16px;border-radius:12px;background:rgba(var(--surface-rgb),.98);border:1px solid var(--accent);box-shadow:var(--shadow);font-weight:600;}
.toast[hidden]{display:none;}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);text-align:left;padding:6px 8px;}
.tbl td{padding:9px 8px;border-top:1px solid var(--glass-b);vertical-align:middle;}
.escala-aviso{font-size:12px;color:var(--txt);}
.ocorr li{padding:7px 0;}

@media (max-width:560px){
  .h1{font-size:20px;} .dois{grid-template-columns:1fr;}
  .seg button{padding:7px 9px;}
  .tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%;}
  .tbl tr{padding:10px 0;border-top:1px solid var(--glass-b);} .tbl td{border:0;padding:4px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;}
  .tbl td::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);flex:none;} .tbl td .bar{flex:1;}
}
@media (hover:none) and (pointer:coarse){ .btn,.seg button,.tabs button,.filtros button{min-height:44px;} input,select,textarea{font-size:16px;} }
@media (prefers-reduced-motion:reduce){ .porto .barco{animation:none;} }

/* ═══ camada da página real (Fase 1) ═══ */
[hidden]{display:none !important;}
.login{max-width:440px;margin:8vh auto 0;padding:26px;text-align:center;}
.login p{color:var(--txt2);margin:10px 0 16px;}
.err{color:var(--txt);background:var(--bad-bg);border:1px solid var(--danger);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:13px;text-align:left;}
.carregando{padding:22px;text-align:center;color:var(--txt2);}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--txt2);}
.who img{width:26px;height:26px;border-radius:50%;object-fit:cover;}
.farol{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.6);}
.farol .lamp{font-size:22px;line-height:1;flex:none;}
.farol.verde{border-color:var(--ok);background:linear-gradient(var(--ok-bg),var(--ok-bg)),rgba(var(--surface-rgb),.6);}
.farol.amarelo{border-color:var(--warn);background:linear-gradient(var(--warn-bg),var(--warn-bg)),rgba(var(--surface-rgb),.6);}
.farol.vermelho{border-color:var(--danger);background:linear-gradient(var(--bad-bg),var(--bad-bg)),rgba(var(--surface-rgb),.6);}
.farol b{display:block;}
.faces{display:flex;gap:8px;flex-wrap:wrap;}
.faces button{width:52px;height:52px;border-radius:14px;border:2px solid var(--glass-b);background:rgba(var(--surface-rgb),.75);font-size:26px;line-height:1;}
.faces button[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(var(--ag-bg),var(--ag-bg)),rgba(var(--surface-rgb),.9);box-shadow:0 0 0 3px var(--glass-h);}
.faces button:hover{border-color:var(--accent);}
.spark{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:8px;}
.spark i{flex:1;max-width:16px;min-height:4px;border-radius:3px;background:var(--accent);opacity:.9;}
.spark i.v{background:transparent;border:1px dashed var(--glass-b);}
.star{padding:12px 14px;border-radius:12px;border:1px solid var(--glass-b);border-left:5px solid var(--warn);background:rgba(var(--surface-rgb),.6);}
.star .de{font-weight:700;}
.pill{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--glass-b);background:rgba(var(--surface2-rgb),.7);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.fase{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;}
.fase span{padding:3px 10px;border-radius:999px;border:1px solid var(--glass-b);font-size:12px;font-weight:700;color:var(--txt2);}
.fase span.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.fase span.ok{border-color:var(--ok);color:var(--txt);}
.sbs{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start;}
@media (max-width:860px){ .sbs{grid-template-columns:1fr;} }
.sbs .lado{position:sticky;top:76px;max-height:78vh;overflow:auto;}
@media (max-width:860px){ .sbs .lado{position:static;max-height:none;} }
.camp label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px;}
.ta{width:100%;min-height:96px;resize:vertical;background:rgba(var(--surface2-rgb),.85);border:1px solid var(--glass-b);border-radius:10px;padding:9px 12px;line-height:1.45;}
.ta[readonly]{opacity:.9;background:rgba(var(--surface2-rgb),.5);}
.cont{font-size:11.5px;color:var(--txt2);text-align:right;}
.trava{border:1px dashed var(--warn);border-radius:12px;padding:12px 14px;background:rgba(var(--surface-rgb),.55);}
.sel2{background:rgba(var(--surface-rgb),.85);border:1px solid var(--glass-b);border-radius:9px;padding:6px 8px;min-height:34px;max-width:100%;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.tbl select{width:100%;}
.pesq{max-width:320px;}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;}
.ck input{width:20px;height:20px;accent-color:var(--accent);}
.divid{height:1px;background:var(--glass-b);margin:14px 0;}
.ovl{position:fixed;inset:0;z-index:70;background:rgba(3,10,18,.62);display:flex;align-items:center;justify-content:center;}
.ovl[hidden]{display:none;}
</style>
</head>
<body>
<div class="ocean" aria-hidden="true"></div>
<header class="topo">
  <div class="topo-in">
    <div class="logo">⛵ Travessia</div>
    <span class="proto" title="Versão de teste (dev)">🧪 Dev</span>
    <div class="sp"></div>
    <div class="who" id="quem" hidden><img id="quem-foto" alt="" hidden><span id="quem-nome"></span><button class="btn s" id="btn-sair" type="button">Sair</button></div>

<script src="mare-login-dev.js?v=3"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, get, set, remove, query, orderByKey, startAt, endAt } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCredential, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  // Override manual sob chave PRÓPRIA desta página ('travessia_dev'): chaves cruas de localStorage são compartilhadas entre as páginas do domínio.
  apiKey:            localStorage.getItem('fb_apiKeytravessia_dev')           || 'AIzaSyBzCOFtPCpaxUcLqX5Sq1GxYL2yAWnDAWU',
  authDomain:        localStorage.getItem('fb_authDomaintravessia_dev')       || 'hering-onboarding.firebaseapp.com',
  databaseURL:       localStorage.getItem('fb_databaseURLtravessia_dev')      || 'https://hering-onboarding-default-rtdb.firebaseio.com',
  projectId:         localStorage.getItem('fb_projectIdtravessia_dev')        || 'hering-onboarding',
  storageBucket:     localStorage.getItem('fb_storageBuckettravessia_dev')    || 'hering-onboarding.firebasestorage.app',
  messagingSenderId: localStorage.getItem('fb_messagingSenderIdtravessia_dev')|| '122502391131',
  appId:             localStorage.getItem('fb_appIdtravessia_dev')            || '1:122502391131:web:0a31bed5ed2494e16ba67e',
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const auth = getAuth(fbApp);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ hd: 'ciahering.com.br' });
window._signIn = () => signInWithPopup(auth, provider);
// Login direto (iPhone/iPad — ver mare-login-dev.js): entrega o id_token que voltou do Google.
window._signInIdToken = idToken => signInWithCredential(auth, GoogleAuthProvider.credential(idToken));

// ───────── utilidades ─────────
const T = 'kanban/travessia/';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const _hrefOk = u => { u = String(u == null ? '' : u).trim(); return /^(https?:\/\/|mailto:)/i.test(u) || /^[a-z0-9_\-]+\.html(\?[^\s"'<>]*)?(#[^\s"'<>]*)?$/i.test(u) ? u : '#'; };
const pad = n => String(n).padStart(2, '0');
const isoDe = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hojeISO = () => isoDe(new Date());
const brDe = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '')); return m ? m[3] + '/' + m[2] : String(iso || ''); };
const brFull = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '')); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso || ''); };
const diasEntre = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 86400000);
const novoId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3600); }
async function G(path) { const s = await get(ref(db, path)); return s.val(); }
const W = (path, v) => set(ref(db, T + path), v);
const D = path => remove(ref(db, T + path));
function uiConfirm(msg, okTxt) {
  return new Promise(res => { const ov = $('#ov'); $('#ov-msg').textContent = msg; $('#ov-ok').textContent = okTxt || 'Confirmar'; ov.hidden = false; $('#ov-ok').focus();
    const fim = v => { ov.hidden = true; $('#ov-ok').onclick = $('#ov-no').onclick = null; document.removeEventListener('keydown', esc_); res(v); };
    const esc_ = ev => { if (ev.key === 'Escape') fim(false); };
    document.addEventListener('keydown', esc_); $('#ov-ok').onclick = () => fim(true); $('#ov-no').onclick = () => fim(false); });
}
function erroAmigavel(e) {
  const m = String((e && (e.code || e.message)) || e);
  if (/PERMISSION_DENIED|permission/i.test(m)) return '🔒 Sem permissão. Se isso é novo, as regras do Travessia ainda podem não ter sido publicadas (firebase deploy --only database).';
  return '⚠️ Não deu pra concluir (' + m.slice(0, 80) + '). Tente de novo.';
}
async function tenta(fn, ok) { try { await fn(); if (ok) toast(ok); return true; } catch (e) { toast(erroAmigavel(e)); console.warn('[travessia]', e); return false; } }

// ───────── regras de negócio (puras — expostas em window.Travessia para teste) ─────────
const CAD = { semanal: 'Semanal', quinzenal: 'Quinzenal', mensal: 'Mensal', trimestral: 'Trimestral' };
const CAD_DIAS = { semanal: 7, quinzenal: 14, mensal: 30, trimestral: 90 };
const TIPO_1A1 = { acomp: 'Acompanhamento', pdi: 'Check-in de PDI', carreira: 'Carreira e ciclo' };
const FACES = [['😣', 'Muito mal'], ['🙁', 'Mal'], ['😐', 'Mais ou menos'], ['🙂', 'Bem'], ['😄', 'Muito bem']];
const FASES = [['preparacao', 'Preparação'], ['coleta', 'Coleta'], ['devolutiva', 'Devolutiva'], ['encerrado', 'Encerrado']];
const PERGUNTAS_PADRAO = {
  auto: { q1: 'Quais foram suas principais entregas neste ciclo e do que você mais se orgulha?', q2: 'Onde você sente que evoluiu? Dê exemplos.', q3: 'Onde você quer evoluir no próximo ciclo?', q4: 'Como seu líder e o time podem te apoiar?' },
  lider: { q1: 'Entregas e impacto no ciclo.', q2: 'Comportamentos que a pessoa deve CONTINUAR fazendo.', q3: 'Comportamentos que deve COMEÇAR ou AJUSTAR para crescer.', q4: 'Próximos passos e oportunidades de desenvolvimento.' },
  par: { q1: 'O que essa pessoa deve CONTINUAR fazendo?', q2: 'O que ela deve COMEÇAR ou AJUSTAR para crescer?', q3: 'Um exemplo concreto de colaboração com ela (opcional).' },
};
// Farol da cadência do 1:1: compara os dias desde o último encontro (menos as folgas da Escala) com a cadência combinada.
// Verde até cadência+1 dia; amarelo até 1,5× a cadência; vermelho acima. Sem cadência ou sem encontro registrado = cinza (convite pra registrar).
function farol({ ultimo, cad, folgas, hoje }) {
  if (!cad || !CAD_DIAS[cad]) return { cor: 'cinza', ic: '⚪', titulo: 'Cadência não definida', sub: 'Defina a cadência do 1:1 (semanal, quinzenal, mensal ou trimestral).' };
  if (!ultimo) return { cor: 'cinza', ic: '⚪', titulo: 'Nenhum 1:1 registrado', sub: 'Cadência ' + CAD[cad].toLowerCase() + '. Registre o último 1:1 para o farol funcionar.' };
  const dias = Math.max(0, diasEntre(ultimo, hoje || hojeISO())); const fo = Math.min(Math.max(0, folgas || 0), dias); const ef = dias - fo;
  const lim = CAD_DIAS[cad]; const cor = ef <= lim + 1 ? 'verde' : ef <= Math.ceil(lim * 1.5) ? 'amarelo' : 'vermelho';
  const nome = { verde: 'Em dia', amarelo: 'Atenção', vermelho: 'Atrasado' }[cor]; const ic = { verde: '🟢', amarelo: '🟡', vermelho: '🔴' }[cor];
  return { cor, ic, dias, efetivo: ef, titulo: nome + ' · ' + (dias === 0 ? 'último 1:1 hoje' : 'último 1:1 há ' + dias + (dias === 1 ? ' dia' : ' dias')),
    sub: 'Cadência ' + CAD[cad].toLowerCase() + (fo ? ' · ' + fo + (fo === 1 ? ' dia de folga descontado' : ' dias de folga descontados') : '') };
}
const ultimoEncontro = enc => Object.values(enc || {}).map(e => e && e.data).filter(Boolean).sort().pop() || null;

// ───────── estado ─────────
const S = { me: null, users: {}, vinc: {}, ciclos: {}, rh: false, adm: false, tab: 'inicio', cache: {}, sel: null, selTab: 'um', aval: {}, ultimoFoco: null, filtroBau: 'todos', pesq: '' };
const nomeDe = uid => (S.users[uid] && (S.users[uid].nome || S.users[uid].name)) || (uid === S.me?.uid ? S.me.nome : 'Pessoa');
const iniDe = uid => (nomeDe(uid).split(' ').map(x => x[0]).slice(0, 2).join('') || '?').toUpperCase();
const liderDe = uid => S.vinc[uid]?.liderUid || null;
const liderados = () => Object.keys(S.vinc).filter(u => S.vinc[u]?.liderUid === S.me.uid).sort((a, b) => nomeDe(a).localeCompare(nomeDe(b)));
const timeAmpliado = () => Object.keys(S.vinc).filter(u => S.vinc[u]?.gerenteUid === S.me.uid && S.vinc[u]?.liderUid !== S.me.uid).sort((a, b) => nomeDe(a).localeCompare(nomeDe(b)));
const ehLider = () => liderados().length > 0 || timeAmpliado().length > 0;
const ciclosAtivos = () => Object.entries(S.ciclos).filter(([, c]) => c && c.status !== 'encerrado').sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
const participa = (c, uid) => !!(c && c.participantes && c.participantes[uid]);
const perguntasDe = (c, g) => Object.assign({}, PERGUNTAS_PADRAO[g], (c && c.perguntas && c.perguntas[g]) || {});
const avatar = uid => `<div class="av" aria-hidden="true">${esc(iniDe(uid))}</div>`;
const chip = (t, c) => `<span class="chip ${c || ''}">${t}</span>`;
const vazio = t => `<div class="vazio">${t}</div>`;
const carregando = t => `<div class="carregando" role="status">${esc(t || 'Conferindo…')}</div>`;

// ───────── leituras (sob demanda, cacheadas até o próximo salvamento) ─────────
async function folgasDe(uid, desdeISO) {
  // Dias de folga da pessoa na Escala entre o último 1:1 e hoje (qualquer squad). Leitura por faixa de datas (as chaves do nó são AAAA-MM-DD).
  try {
    const v = (await get(query(ref(db, 'kanban/escala'), orderByKey(), startAt(desdeISO), endAt(hojeISO())))).val() || {};
    const dias = new Set();
    Object.keys(v).forEach(d => { if (d < desdeISO || d > hojeISO()) return; Object.values(v[d] || {}).forEach(sq => { const e = sq && sq[uid]; if (e && e.t === 'folga') dias.add(d); }); });
    return dias.size;
  } catch (e) { return 0; }
}
async function carregaUm(uid) {   // série + encontros + farol de UMA pessoa
  const [serie, enc] = await Promise.all([G(T + 'serie/' + uid), G(T + 'encontros/' + uid)]);
  const ultimo = ultimoEncontro(enc);
  const folgas = ultimo && serie?.cad ? await folgasDe(uid, ultimo) : 0;
  return { serie: serie || null, enc: enc || {}, ultimo, farol: farol({ ultimo, cad: serie?.cad, folgas }) };
}
async function carregaHumor(uid, compartilhado) {
  const v = (await G(T + (compartilhado ? 'humor_comp/' : 'humor/') + uid)) || {};
  if (compartilhado) return v;
  const c = (await G(T + 'humor_comp/' + uid)) || {};   // dias que a própria pessoa escolheu compartilhar com o líder
  Object.keys(v).forEach(k => { v[k] = Object.assign({}, v[k], { comp: !!c[k] }); });
  return v;
}
async function carregaBau(uid) { return (await G(T + 'bau/' + uid)) || {}; }
async function carregaEstrelas() {
  // Estrelas (Kudos) recebidas: mural geral + as squads da pessoa. Só mostramos a seção se houver alguma.
  const eu = S.users[S.me.uid] || {}; const sqs = Object.keys(eu.squads || {}).filter(k => eu.squads[k]);
  const leitura = async (path, escopo) => { try { const v = await G(path); const arr = Array.isArray(v) ? v : Object.values(v || {}); return arr.filter(Boolean).map(k => Object.assign({}, k, { _escopo: escopo })); } catch (e) { return []; } };
  const todas = (await Promise.all([leitura('kanban/painel/kudos_geral', 'geral')].concat(sqs.map(s => leitura('kanban/squads/' + s + '/dados/kudos', s))))).flat();
  const minhas = todas.filter(k => (k.toUid && k.toUid === S.me.uid) || (!k.toUid && eu.init && k.toInit === eu.init));
  const vistos = new Set(); return minhas.filter(k => { const id = k.id || (k.ts + k.fromUid); if (vistos.has(id)) return false; vistos.add(id); return true; }).sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
}
async function carregaAval(cid, uid) {   // tudo que EU posso ler da avaliação de uma pessoa (cada nó tem a sua regra; o que nega vira null)
  const ler = async p => { try { return await G(T + 'avaliacoes/' + cid + '/' + uid + '/' + p); } catch (e) { return null; } };
  const [pares, auto, lider, resp, devol, ciente] = await Promise.all([ler('pares'), ler('auto'), ler('lider'), ler('resp_pares'), ler('devolutiva'), ler('ciente')]);
  return { pares: pares || {}, auto, lider, resp: resp || {}, devol, ciente };
}
const invalida = k => { Object.keys(S.cache).filter(x => x === k || x.startsWith(k + ':')).forEach(x => delete S.cache[x]); };
async function cache(k, fn) { if (!(k in S.cache)) S.cache[k] = await fn(); return S.cache[k]; }

// ───────── telas ─────────
function viewFarol(uid, d, quem) {
  const f = d.farol; return `<div class="farol ${f.cor}"><span class="lamp" aria-hidden="true">${f.ic}</span><div><b>${esc(f.titulo)}</b><span class="small">${esc(f.sub)}</span></div></div>`;
}
function sparkHumor(h, dias) {
  const out = []; const hoje = new Date();
  for (let i = dias - 1; i >= 0; i--) { const d = new Date(hoje); d.setDate(hoje.getDate() - i); const k = isoDe(d); const n = h[k] && h[k].n; out.push(n ? `<i style="height:${n * 20}%" title="${brDe(k)}: ${FACES[n - 1][1]}"></i>` : `<i class="v" title="${brDe(k)}: sem registro"></i>`); }
  return `<div class="spark" role="img" aria-label="Humor dos últimos ${dias} dias">${out.join('')}</div>`;
}
async function viewInicio() {
  const me = S.me.uid; const lid = liderDe(me);
  const [um, humor, bau, estrelas] = await Promise.all([cache('um:' + me, () => carregaUm(me)), cache('humor:' + me, () => carregaHumor(me, false)), cache('bau:' + me, () => carregaBau(me)), cache('estrelas', carregaEstrelas)]);
  const hj = hojeISO(); const hHoje = humor[hj]; const comp = !!(hHoje && hHoje.comp);
  const itensBau = Object.entries(bau).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  const pend = []; ciclosAtivos().forEach(([cid, c]) => { if (participa(c, me)) pend.push(`<li><span aria-hidden="true">📐</span><div class="tx"><b>${esc(c.nome)}</b> — fase ${esc((FASES.find(f => f[0] === c.status) || [0, c.status])[1])}</div><button class="btn s" data-tab="aval">Abrir</button></li>`); });
  return `<div class="stack">
   <div class="grid g2">
    <section class="gl pad stack" aria-labelledby="t-um"><h2 class="h2" id="t-um">🚦 Meu 1:1${lid ? ' com ' + esc(nomeDe(lid)) : ''}</h2>
      ${lid ? viewFarol(me, um) : `<div class="vazio">Seu líder ainda não foi definido no organograma. Peça ao ADM ou ao RH para configurar.</div>`}
      ${lid ? `<form class="row" data-form="encontro" data-uid="${me}"><label class="sr" for="enc-d">Data do 1:1</label><input class="in" id="enc-d" type="date" name="data" value="${hj}" max="${hj}" style="max-width:170px"><button class="btn p" type="submit">✅ Registrei um 1:1</button></form>` : ''}
      ${um.ultimo ? `<p class="small">Último registro: ${brFull(um.ultimo)}</p>` : ''}</section>
    <section class="gl pad stack" aria-labelledby="t-hu"><h2 class="h2" id="t-hu">🌤️ Como você está hoje?</h2>
      <div class="faces" role="group" aria-label="Humor de hoje">${FACES.map((f, i) => `<button type="button" data-act="humor" data-n="${i + 1}" aria-pressed="${hHoje && hHoje.n === i + 1}" aria-label="${f[1]}" title="${f[1]}">${f[0]}</button>`).join('')}</div>
      <label class="ck"><input type="checkbox" id="humor-comp" ${comp ? 'checked' : ''} ${hHoje ? '' : ''}> Compartilhar com meu líder${lid ? ' (' + esc(nomeDe(lid)) + ')' : ''}</label>
      <p class="small">Só você vê, a menos que compartilhe. Ninguém (nem o sistema) analisa seu humor.</p>
      ${sparkHumor(humor, 14)}</section></div>
   ${pend.length ? `<section class="gl pad" aria-labelledby="t-av"><h2 class="h2" id="t-av">📐 Avaliação</h2><ul class="lst">${pend.join('')}</ul></section>` : ''}
   ${estrelas.length ? `<section class="gl pad stack" aria-labelledby="t-es"><h2 class="h2" id="t-es">⭐ Mural de Estrelas <span class="chip">${estrelas.length}</span></h2>
      <div class="grid g3">${estrelas.slice(0, 9).map(k => `<article class="star"><div class="de">${esc(k.fromNome || 'Alguém')}</div><div>${esc(k.texto || '')}</div><div class="meta"><span class="chip">${esc(String(k.ts || '').slice(0, 10).split('-').reverse().join('/'))}</span><span class="chip">${k._escopo === 'geral' ? '🌊 Geral' : esc(k._escopo)}</span></div>
      <div class="row" style="margin-top:8px"><button class="btn s" data-act="estrela-bau" data-id="${esc(k.id || '')}" data-i="${estrelas.indexOf(k)}">📌 Guardar no Baú</button></div></article>`).join('')}</div></section>` : ''}
   <section class="gl pad stack" aria-labelledby="t-ba"><div class="row" style="justify-content:space-between"><h2 class="h2" id="t-ba">📦 Meu Baú <span class="chip">${itensBau.length}</span></h2><button class="btn s" data-tab="bau">Abrir o Baú</button></div>
     ${itensBau.length ? `<ul class="lst">${itensBau.slice(0, 3).map(([id, b]) => `<li><span aria-hidden="true">${iconeBau(b.tipo)}</span><div class="tx">${esc(b.titulo)}<div class="meta"><span class="chip">${esc(brFull(b.em || isoDe(new Date(b.ts || 0))))}</span></div></div></li>`).join('')}</ul>` : vazio('Seu Baú está vazio. Guarde entregas e aprendizados para lembrar de tudo na hora da avaliação.')}</section></div>`;
}
const iconeBau = t => ({ card: '🌊', marco: '🎯', kudo: '⭐', manual: '✍️' }[t] || '📌');

async function viewBau(uid, somenteLeitura) {
  const bau = await cache('bau:' + uid, () => carregaBau(uid));
  const itens = Object.entries(bau).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0)).filter(([, b]) => S.filtroBau === 'todos' || b.tipo === S.filtroBau);
  return `<section class="gl pad stack" aria-labelledby="bau-t"><h2 class="h2" id="bau-t">📦 ${somenteLeitura ? 'Baú de ' + esc(nomeDe(uid)) : 'Baú da Travessia'}</h2>
   <p class="sub">Suas conquistas do ciclo, guardadas no dia a dia — assim a avaliação não depende da memória. Entregas do Maré, marcos do Radar e Estrelas entram com 1 clique (📌); o resto você registra aqui.</p>
   <div class="filtros" role="group" aria-label="Filtrar o Baú">${[['todos', 'Tudo'], ['card', '🌊 Maré'], ['marco', '🎯 Radar'], ['kudo', '⭐ Estrelas'], ['manual', '✍️ Manual']].map(([k, l]) => `<button data-act="filtro-bau" data-f="${k}" aria-pressed="${S.filtroBau === k}">${l}</button>`).join('')}</div>

     <label for="b-a">O que eu fiz</label><textarea class="ta" id="b-a" name="acao" maxlength="380" style="min-height:60px"></textarea>
     <label for="b-i">Impacto gerado</label><textarea class="ta" id="b-i" name="impacto" maxlength="380" style="min-height:60px"></textarea>
     <label for="b-c">Competência <span class="small">(opcional)</span></label><input class="in" id="b-c" name="comp" maxlength="60" placeholder="Ex.: Comunicação, Liderança…">

  const eu = ++rendering; const tabs = TABS(); const rasc = {}; document.querySelectorAll('textarea.ta:not([readonly])').forEach(t => { if (t.id) rasc[t.id] = t.value; }); if (!tabs.some(t => t[0] === S.tab)) S.tab = 'inicio';
  const foco = document.activeElement && document.activeElement.id; const sel = document.activeElement && document.activeElement.selectionStart;
  $('#app').innerHTML = `<div class="hero"><div><h1 class="h1">Olá, ${esc((S.me.nome || '').split(' ')[0] || 'bem-vinda(o)')} 👋</h1><p class="sub">Sua travessia: o que você quer construir e como a gente te ajuda a chegar lá.</p></div></div>
    <div class="tabs" role="tablist" aria-label="Seções">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('')}</div><div role="tabpanel" id="painel">${carregando()}</div>`;
  let html = '';
  try { html = await ({ inicio: viewInicio, bau: () => viewBau(S.me.uid, false), aval: viewAval, frota: viewFrota, admin: viewAdmin }[S.tab])(); }
  catch (e) { console.warn('[travessia]', e); html = `<div class="err">${esc(erroAmigavel(e))}</div>`; }
  if (eu !== rendering) return;
  $('#painel').innerHTML = html;
  Object.keys(rasc).forEach(id => { const el = document.getElementById(id); if (el && !el.readOnly && rasc[id] && !el.value) el.value = rasc[id]; });   // não perde o que a pessoa estava escrevendo
  if (foco) { const el = document.getElementById(foco); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (_) {} } }
}

// ───────── ações ─────────
async function guardarBau(item) { const id = novoId(); item.ts = Date.now(); item.em = item.em || hojeISO(); const ok = await tenta(() => W('bau/' + S.me.uid + '/' + id, item), '📌 Guardado no seu Baú!'); if (ok) { invalida('bau:' + S.me.uid); } return ok; }
const salvaResp = async (cid, av, grupo, caminho) => {
  const dados = { ts: Date.now() }; document.querySelectorAll(`textarea[data-resp="${grupo}"][data-ctx="${cid}_${av}"]`).forEach(t => { if (t.value.trim()) dados[t.dataset.q] = t.value.trim(); });
  if (Object.keys(dados).length < 2) { toast('Escreva pelo menos uma resposta antes de salvar.'); return false; }
  return tenta(() => W(caminho, dados), '💾 Salvo!');
};
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-tab],[data-act]'); if (!b) return;
  const a = b.dataset.act; const me = S.me && S.me.uid;
  if (b.dataset.tab && !a) { S.tab = b.dataset.tab; S.sel = null; S.pesq = ''; return render(); }
  if (a === 'filtro-bau') { S.filtroBau = b.dataset.f; return render(); }
  if (a === 'humor') {
    const n = +b.dataset.n; const k = hojeISO(); const comp = $('#humor-comp') && $('#humor-comp').checked; const reg = { n, ts: Date.now() };
    const ok = await tenta(async () => { await W('humor/' + me + '/' + k, Object.assign({}, reg)); if (comp) await W('humor_comp/' + me + '/' + k, reg); else await D('humor_comp/' + me + '/' + k); }, FACES[n - 1][0] + ' Humor de hoje registrado.');
    if (ok) { S.cache['humor:' + me] = Object.assign({}, S.cache['humor:' + me], { [k]: Object.assign({ comp }, reg) }); render(); } return;
  }
  if (a === 'estrela-bau') { const est = await cache('estrelas', carregaEstrelas); const k = est[+b.dataset.i]; if (!k) return; const ok = await guardarBau({ tipo: 'kudo', titulo: ('Estrela de ' + (k.fromNome || 'alguém')).slice(0, 160), texto: String(k.texto || '').slice(0, 1200), ref: String(k.id || '').slice(0, 200), squad: k._escopo === 'geral' ? 'geral' : k._escopo, em: String(k.ts || '').slice(0, 10) || hojeISO() }); if (ok) render(); return; }
  if (a === 'bau-del') { if (!(await uiConfirm('Remover este item do Baú?', 'Remover'))) return; if (await tenta(() => D('bau/' + me + '/' + b.dataset.id), 'Removido.')) { invalida('bau:' + me); render(); } return; }
  if (a === 'abrir') { S.sel = b.dataset.uid; S.selTab = 'um'; await render(); const d = $('#detalhe'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (a === 'fechar') { S.sel = null; return render(); }
  if (a === 'sel-aba') { S.selTab = b.dataset.k; return render(); }
  if (a === 'enc-del') { if (await tenta(() => D('encontros/' + b.dataset.uid + '/' + b.dataset.id), 'Registro apagado.')) { invalida('um:' + b.dataset.uid); render(); } return; }
  if (a === 'citar') { const t = S.ultimoFoco; if (!t) { toast('Clique antes na resposta onde quer citar.'); return; } const el = document.getElementById(t); if (el && !el.readOnly) { el.value = (el.value ? el.value + '\n' : '') + '• ' + b.dataset.t; el.focus(); } return; }
  if (a === 'par-sugerir') { const [cid, par] = [b.dataset.cid, b.dataset.par]; if (await tenta(() => W(`avaliacoes/${cid}/${me}/pares/${par}`, { aprovado: false, por: 'avaliado', ts: Date.now() }), 'Indicação enviada ao seu líder.')) { invalida('aval:' + cid + ':' + me); render(); } return; }
  if (a === 'par-retirar') { const [cid, par] = [b.dataset.cid, b.dataset.par]; if (await tenta(() => D(`avaliacoes/${cid}/${me}/pares/${par}`))) { invalida('aval:' + cid + ':' + me); render(); } return; }
  if (a === 'auto-salvar') { if (await salvaResp(b.dataset.cid, me, 'auto', `avaliacoes/${b.dataset.cid}/${me}/auto`)) { invalida('aval:' + b.dataset.cid + ':' + me); render(); } return; }
  if (a === 'par-salvar') { const { cid, av } = b.dataset; if (await salvaResp(cid, av, 'par', `avaliacoes/${cid}/${av}/resp_pares/${me}`)) { invalida('resp:' + cid + ':' + av); render(); } return; }
  if (a === 'lider-salvar') { const { cid, av } = b.dataset; if (await salvaResp(cid, av, 'lider', `avaliacoes/${cid}/${av}/lider`)) { invalida('aval:' + cid + ':' + av); render(); } return; }
  if (a === 'ciente') { const cid = b.dataset.cid; if (await tenta(() => W(`avaliacoes/${cid}/${me}/ciente`, Date.now()), '✔ Ciência registrada.')) { invalida('aval:' + cid + ':' + me); render(); } return; }
  if (a === 'par-aprovar' || a === 'par-reprovar') {
    const { cid, av, par } = b.dataset; const existente = (S.cache['aval:' + cid + ':' + av]?.pares || {})[par] || {};
    const ok = await tenta(async () => {
      if (a === 'par-aprovar') { await W(`avaliacoes/${cid}/${av}/pares/${par}`, { aprovado: true, por: existente.por || 'lider', ts: Date.now() }); await W(`pedidos_par/${par}/${cid}_${av}`, { cid, avaliado: av, ts: Date.now() }); }
      else { await D(`pedidos_par/${par}/${cid}_${av}`); await D(`avaliacoes/${cid}/${av}/pares/${par}`); }
    }, a === 'par-aprovar' ? '✅ Par aprovado — ele já pode responder.' : 'Par retirado.');
    if (ok) { invalida('aval:' + cid + ':' + av); render(); } return;
  }
  if (a === 'devol-salvar' || a === 'devol-liberar' || a === 'devol-recolher') {
    const { cid, av } = b.dataset; const txt = ($('#dv-t') && $('#dv-t').value.trim()) || ''; const atual = S.cache['aval:' + cid + ':' + av]?.devol || {};
    if (a === 'devol-liberar' && !txt) { toast('Escreva a síntese antes de liberar.'); return; }
    if (a === 'devol-liberar' && !(await uiConfirm('Liberar a devolutiva para ' + nomeDe(av).split(' ')[0] + '? A pessoa passa a ver o texto agora.', '🔓 Liberar'))) return;
    const dados = { texto: txt.slice(0, 6000), liberada: a === 'devol-liberar' ? true : (a === 'devol-recolher' ? false : atual.liberada === true), ts: Date.now(), por: me };
    if (dados.liberada) dados.liberadaEm = atual.liberadaEm || Date.now();
    if (await tenta(() => W(`avaliacoes/${cid}/${av}/devolutiva`, dados), a === 'devol-liberar' ? '🔓 Devolutiva liberada.' : a === 'devol-recolher' ? '🔒 Liberação recolhida.' : '💾 Rascunho salvo.')) { invalida('aval:' + cid + ':' + av); render(); } return;
  }
  if (a === 'ciclo-fase') { const { cid, fase } = b.dataset; const c = Object.assign({}, S.ciclos[cid], { status: fase }); if (await tenta(() => W('ciclos/' + cid + '/status', fase), 'Fase atualizada.')) { S.ciclos[cid] = c; render(); } return; }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.actChange === 'cad') { const uid = t.dataset.uid; if (!t.value) return; if (await tenta(() => W('serie/' + uid, { cad: t.value, tipo: 'acomp', ts: Date.now() }), 'Cadência definida.')) { invalida('um:' + uid); render(); } return; }
  if (t.dataset.vinc) { const uid = t.dataset.vinc; const v = Object.assign({}, S.vinc[uid] || {}); v[t.dataset.campo] = t.value || null; if (!v.liderUid) { if (await tenta(() => D('vinculos/' + uid), 'Vínculo removido.')) { delete S.vinc[uid]; } return render(); } Object.keys(v).forEach(k => { if (!v[k]) delete v[k]; }); if (await tenta(() => W('vinculos/' + uid, v), 'Organograma atualizado.')) { S.vinc[uid] = v; } return; }
  if (t.dataset.rh) { const uid = t.dataset.rh; if (await tenta(() => (t.checked ? W('papeis/' + uid, 'rh') : D('papeis/' + uid)), t.checked ? '🤝 Papel de RH concedido.' : 'Papel de RH removido.')) invalida('papeis'); else t.checked = !t.checked; return; }
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('textarea[data-resp]')) S.ultimoFoco = e.target.id; });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.pesq) { S.pesq = e.target.value; clearTimeout(window.__pT); window.__pT = setTimeout(render, 220); } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const k = f.dataset.form; const fd = new FormData(f); const me = S.me.uid;
  if (k === 'encontro') { const uid = f.dataset.uid; const data = fd.get('data'); if (!/^\d{4}-\d{2}-\d{2}$/.test(data || '')) { toast('Escolha a data do 1:1.'); return; } if (data > hojeISO()) { toast('O 1:1 registrado não pode estar no futuro.'); return; }
    if (await tenta(() => W('encontros/' + uid + '/' + novoId(), { data, tipo: fd.get('tipo') || 'acomp', por: me, ts: Date.now() }), '✅ 1:1 registrado.')) { invalida('um:' + uid); render(); } return; }
  if (k === 'bau') { const titulo = (fd.get('titulo') || '').trim(); if (!titulo) return; const partes = []; [['desafio', 'Desafio'], ['acao', 'O que fiz'], ['impacto', 'Impacto']].forEach(([c, r]) => { const v = (fd.get(c) || '').trim(); if (v) partes.push(r + ': ' + v); });
    const item = { tipo: 'manual', titulo: titulo.slice(0, 160) }; if (partes.length) item.texto = partes.join('\n').slice(0, 1200); if ((fd.get('comp') || '').trim()) item.comp = fd.get('comp').trim().slice(0, 60); if (await guardarBau(item)) render(); return; }
  if (k === 'ciclo') { const nome = (fd.get('nome') || '').trim(); if (!nome) return; const sqs = fd.getAll('sq'); const part = {}; Object.keys(S.users).forEach(u => { const us = S.users[u].squads || {}; if (sqs.some(s => us[s])) part[u] = true; });
    if (!Object.keys(part).length) { toast('Marque ao menos uma squad com pessoas.'); return; }
    const cid = 'c' + Date.now().toString(36); const c = { nome: nome.slice(0, 80), status: 'preparacao', ts: Date.now(), criadoPor: me, participantes: part, perguntas: PERGUNTAS_PADRAO };
    if (await tenta(() => W('ciclos/' + cid, c), '📐 Ciclo criado.')) { S.ciclos[cid] = c; render(); } return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-pesq]')) e.preventDefault(); });

// ───────── login e boot ─────────
function mostraLogin(msg) { $('#login').hidden = false; $('#app').hidden = true; $('#quem').hidden = true; $('#login-err').textContent = msg || ''; $('#login-err').hidden = !msg; }
$('#btn-login').addEventListener('click', () => { $('#login-err').hidden = true; if (window.MareLogin && MareLogin.usar()) { MareLogin.iniciar({ hub: true }); return; } window._signIn().catch(e => mostraLogin('Não deu pra entrar: ' + (e && e.message || e))); });
$('#btn-sair').addEventListener('click', () => signOut(auth));
$('#btn-tema').addEventListener('click', () => { const atual = document.documentElement.getAttribute('data-theme') || ''; const i = TEMAS.findIndex(x => x[0] === atual); aplicaTema(TEMAS[(i + 1) % TEMAS.length][0], true); });
const TEMAS = [['', '🌙', 'Abrolhos'], ['light', '☀️', 'Lençóis Maranhenses'], ['sunset', '🌅', 'Entardecer']];
function aplicaTema(v, avisa) { const i = Math.max(0, TEMAS.findIndex(x => x[0] === v)), t = TEMAS[i]; if (t[0]) document.documentElement.setAttribute('data-theme', t[0]); else document.documentElement.removeAttribute('data-theme'); $('#btn-tema').textContent = t[1]; try { localStorage.setItem('mare_theme', t[0] === 'light' ? 'light' : t[0] === 'sunset' ? 'vice' : 'dark'); localStorage.setItem('travessia_tema', t[0]); } catch (_) {} if (avisa) toast(t[1] + ' ' + t[2]); }
try { const t = localStorage.getItem('travessia_tema'); if (t) aplicaTema(t); else { const m = localStorage.getItem('mare_theme'); if (m === 'light') aplicaTema('light'); } } catch (_) {}

onAuthStateChanged(auth, async u => {
  if (window.MareLogin && MareLogin.voltando) return;
  if (!u) { S.me = null; const av = S.aviso; S.aviso = ''; return mostraLogin(av); }
  const empresa = /@ciahering\.com\.br$/i.test(u.email || '') && (u.providerData || []).some(p => p.providerId === 'google.com');
  if (!empresa) { S.aviso = 'O Travessia é só para contas Google @ciahering.com.br.'; mostraLogin(S.aviso); signOut(auth).catch(() => {}); return; }
  S.me = { uid: u.uid, email: u.email, nome: u.displayName || u.email, foto: u.photoURL || '' };
  $('#login').hidden = true; $('#app').hidden = false; $('#quem').hidden = false; $('#quem-nome').textContent = S.me.nome; if (S.me.foto) { $('#quem-foto').src = S.me.foto; $('#quem-foto').hidden = false; }
  $('#app').innerHTML = carregando('Abrindo sua travessia…');
  try {
    const [users, eu, vinc, ciclos, papel] = await Promise.all([G('kanban/usuarios_publicos'), G('kanban/usuarios/' + u.uid), G(T + 'vinculos'), G(T + 'ciclos'), G(T + 'papeis/' + u.uid)]);
    S.users = users || {}; S.adm = !!((eu && eu.role === 'adm') || (u.email || '').toLowerCase() === 'caio.soares@ciahering.com.br'); S.vinc = vinc || {}; S.ciclos = ciclos || {}; S.rh = papel === 'rh';
    if (!S.users[u.uid]) S.users[u.uid] = { nome: S.me.nome, squads: (eu && eu.squads) || {}, init: (eu && eu.init) || '' };
    await render();
  } catch (e) { console.warn('[travessia]', e); $('#app').innerHTML = `<div class="err">${esc(erroAmigavel(e))}</div>`; }
});
window.Travessia = { farol, ultimoEncontro, diasEntre, CAD_DIAS, estado: S, render };
</script>
