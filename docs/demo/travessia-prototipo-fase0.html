<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 Travessia · Protótipo</title>
<link rel="icon" type="image/png" href="favicon-oceano.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ═══ Travessia — PROTÓTIPO da Fase 0 (docs/ideias/travessia-2026-10-22.md) ═══
   Sem Firebase, sem login, sem banco: tudo aqui é FICTÍCIO (pessoas, números, datas). Serve para validar a metáfora e o fluxo com POs antes de tocar em regras.
   Marine Glass: mesmos tokens do Oceano (abrolhos = escuro, lencois = claro, entardecer). Estado nunca só pela cor (cor + ícone + texto). */
:root{
  --deep:#030d1a;--deep-rgb:3,13,26;--glass:rgba(10,37,64,0.74);--glass-b:rgba(56,182,255,0.3);--glass-h:rgba(56,182,255,0.12);
  --accent:#38b6ff;--cyan:#7ec8e3;--teal:#1de9b6;
  --txt:#e8f4fd;--txt2:rgba(200,230,255,0.78);--txt3:rgba(150,200,240,0.6);
  --warn:#ffd166;--danger:#ff6b6b;--ok:#4ade80;--r:10px;--r2:14px;
  --surface-rgb:10,30,55;--surface2-rgb:6,22,40;--ink-rgb:3,13,26;--on-accent:#04141f;
  --ok-bg:rgba(74,222,128,.18);--warn-bg:rgba(255,209,102,.18);--bad-bg:rgba(255,107,107,.2);--ag-bg:rgba(56,182,255,.18);
  --ff-d:'Syne','DM Sans',sans-serif;--ff:'DM Sans',system-ui,sans-serif;--shadow:0 10px 34px rgba(0,0,0,.35);
  --ocean:radial-gradient(ellipse at 20% 80%,rgba(0,80,160,.4) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(0,150,180,.25) 0%,transparent 55%),#010810;
}
:root[data-theme="light"]{
  --deep:#0F87C4;--deep-rgb:15,135,196;--glass:rgba(255,255,255,0.72);--glass-b:rgba(0,124,168,0.28);--glass-h:rgba(0,124,168,0.1);
  --accent:#006a9a;--cyan:#065670;--teal:#0a7d75;
  --txt:#0B2436;--txt2:rgba(11,36,54,0.84);--txt3:rgba(11,36,54,0.68);
  --warn:#8a5a00;--danger:#b3261e;--ok:#1a7a44;--surface-rgb:251,253,255;--surface2-rgb:235,245,250;--ink-rgb:251,253,255;--on-accent:#ffffff;
  --ok-bg:rgba(26,122,68,.14);--warn-bg:rgba(138,90,0,.15);--bad-bg:rgba(179,38,30,.12);--ag-bg:rgba(0,106,154,.13);--shadow:0 10px 30px rgba(7,70,110,.22);
  --ocean:radial-gradient(ellipse at 20% 80%,rgba(0,183,180,.30) 0%,transparent 62%),radial-gradient(ellipse at 80% 15%,rgba(0,151,214,.30) 0%,transparent 58%),linear-gradient(175deg,#57C4E0 0%,#0F87C4 100%);
}
:root[data-theme="sunset"]{
  --deep:#1a1530;--deep-rgb:26,21,48;--glass:rgba(38,28,58,0.84);--glass-b:rgba(255,176,110,0.38);--glass-h:rgba(255,176,110,0.14);
  --accent:#ffb36b;--cyan:#ffd2a1;--teal:#ffcf6e;
  --txt:#fdf1e4;--txt2:rgba(253,241,228,0.84);--txt3:rgba(253,241,228,0.66);
  --surface-rgb:48,34,66;--surface2-rgb:34,24,50;--ink-rgb:26,21,48;--on-accent:#2a1405;
  --ok-bg:rgba(74,222,128,.18);--warn-bg:rgba(255,207,110,.2);--bad-bg:rgba(255,120,120,.22);--ag-bg:rgba(255,179,107,.2);
  --ocean:radial-gradient(ellipse 80% 45% at 50% 38%,rgba(255,160,70,.5) 0%,rgba(255,120,60,.16) 45%,transparent 70%),linear-gradient(180deg,#141d3f 0%,#2a2a55 22%,#7a4a56 38%,#d98a58 47%,#1b4a63 48.4%,#0d2f4b 62%,#071c33 100%);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;}
body{font-family:var(--ff);color:var(--txt);background:var(--deep);font-size:14px;line-height:1.45;overflow-x:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;}

/* fundo: camada fixa (mesmo padrão do Oceano) — --ocean é uma lista de camadas e NÃO funciona dentro do atalho `background:` */
.ocean{position:fixed;inset:0;z-index:-3;pointer-events:none;background:var(--ocean);}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:rgba(var(--deep-rgb),.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-b);}
.topo-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;}
:root[data-theme="light"] .topo{background:rgba(255,255,255,.86);}
.logo{font-family:var(--ff-d);font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;}
.proto{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px dashed var(--warn);color:var(--txt);background:rgba(var(--surface-rgb),.7);}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:rgba(var(--surface2-rgb),.75);border:1px solid var(--glass-b);flex-wrap:wrap;}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--txt2);min-height:34px;}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);}
.lbl{font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;}
.topo .sp{flex:1;}
.sel{background:rgba(var(--surface-rgb),.85);border:1px solid var(--glass-b);border-radius:9px;padding:6px 10px;min-height:34px;}

/* vidro */
.gl{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.pad{padding:16px;}
.h1{font-family:var(--ff-d);font-size:24px;font-weight:800;line-height:1.15;}
.h2{font-family:var(--ff-d);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sub{color:var(--txt2);font-size:13px;}
.small{font-size:12px;color:var(--txt2);}
.hero{margin:18px 0 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));}
.stack>*+*{margin-top:12px;}

/* abas */
.tabs{display:flex;gap:4px;margin:14px 0;overflow-x:auto;padding:3px;border-radius:12px;background:rgba(var(--surface2-rgb),.7);border:1px solid var(--glass-b);scrollbar-width:thin;}
.tabs button{flex:none;border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--txt2);min-height:40px;white-space:nowrap;}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(0,0,0,.25);}
.tabs .n{font-size:11px;margin-left:4px;opacity:.85;}

/* botões e chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.8);padding:8px 13px;border-radius:10px;font-weight:700;font-size:13px;min-height:38px;}
.btn:hover{border-color:var(--accent);}
.btn.p{background:linear-gradient(135deg,var(--accent),var(--teal));color:var(--on-accent);border:0;}
.btn.s{padding:4px 10px;min-height:30px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.55;cursor:default;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--glass-b);background:rgba(var(--surface2-rgb),.7);color:var(--txt);white-space:nowrap;}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);} .chip.warn{border-color:var(--warn);background:var(--warn-bg);} .chip.bad{border-color:var(--danger);background:var(--bad-bg);} .chip.ag{border-style:dashed;border-color:var(--accent);background:var(--ag-bg);}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;}
.filtros button{border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.7);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;min-height:34px;color:var(--txt);}
.filtros button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}

/* rota */
.rota{list-style:none;display:flex;gap:0;position:relative;padding:6px 0 0;}
.rota::before{content:"";position:absolute;left:4%;right:4%;top:33px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--glass-b) 0 10px,transparent 10px 16px);}
.porto{flex:1;min-width:0;text-align:center;position:relative;padding:0 4px;}
.porto .pt{width:54px;height:54px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(var(--surface-rgb),.95);border:2px solid var(--glass-b);position:relative;}
.porto.feito .pt{border-color:var(--ok);}
.porto.atual .pt{border-color:var(--accent);box-shadow:0 0 0 4px var(--glass-h);}
.porto .barco{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:22px;animation:bob 2.8s ease-in-out infinite;}
.porto .t{font-size:12.5px;font-weight:700;margin-top:8px;line-height:1.25;}
.porto .d{font-size:11.5px;color:var(--txt2);margin-top:2px;}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0) rotate(0);}50%{transform:translateX(-50%) translateY(-4px) rotate(-6deg);}}
@media (max-width:760px){
  .rota{flex-direction:column;gap:14px;padding-left:4px;}
  .rota::before{left:31px;right:auto;top:20px;bottom:20px;width:4px;height:auto;background:repeating-linear-gradient(180deg,var(--glass-b) 0 10px,transparent 10px 16px);}
  .porto{display:grid;grid-template-columns:62px 1fr;text-align:left;align-items:center;gap:0 6px;padding:0;}
  .porto .pt{margin:0;}
  .porto .barco{top:-14px;left:31px;}
  .porto .t{margin-top:0;}
}

/* anel / barra */
.ring{position:relative;flex:none;width:62px;height:62px;}
.ring svg{display:block;transform:rotate(-90deg);}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.bar{height:8px;border-radius:99px;background:rgba(var(--ink-rgb),.35);overflow:hidden;}
:root[data-theme="light"] .bar{background:rgba(11,36,54,.14);}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--teal));}

/* listas */
.lst{list-style:none;}
.lst li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--glass-b);}
.lst li:last-child{border-bottom:0;}
.lst .tx{flex:1;min-width:0;word-break:break-word;}
.lst .feita{text-decoration:line-through;opacity:.85;}
.cb{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent);}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.foco{padding:14px;border-radius:var(--r2);border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.55);}
.foco-h{display:flex;gap:12px;align-items:center;}
.foco-h .tt{flex:1;min-width:0;font-weight:700;}
.rasc{border-style:dashed;border-color:var(--accent);background:linear-gradient(var(--ag-bg),var(--ag-bg)),rgba(var(--surface-rgb),.55);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.in{flex:1;min-width:160px;background:rgba(var(--surface2-rgb),.8);border:1px solid var(--glass-b);border-radius:10px;padding:9px 12px;min-height:40px;}
textarea.in{width:100%;min-height:92px;resize:vertical;}
.tile{padding:12px;border-radius:12px;border:1px solid var(--glass-b);background:rgba(var(--surface-rgb),.55);}
.tile b{display:block;font-family:var(--ff-d);font-size:24px;line-height:1.1;}
.tile span{font-size:12px;color:var(--txt2);}
.vazio{border:1px dashed var(--glass-b);border-radius:12px;padding:16px;text-align:center;color:var(--txt2);font-size:13px;}
.nota{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--accent);background:linear-gradient(var(--ag-bg),var(--ag-bg)),rgba(var(--surface2-rgb),.7);font-size:12.5px;color:var(--txt);}

/* frota */
.pcard{padding:14px;cursor:default;}
.pcard.at{border-color:var(--warn);border-left-width:5px;background:linear-gradient(var(--warn-bg),var(--warn-bg)),var(--glass);}
.pcard .top{display:flex;gap:12px;align-items:center;}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--teal));color:var(--on-accent);}
.strip{display:flex;gap:3px;margin-top:10px;}
.strip i{width:100%;max-width:22px;height:22px;border-radius:5px;border:1px solid var(--glass-b);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;line-height:1;color:var(--txt);background:rgba(var(--surface2-rgb),.6);}
.strip i.d{background:var(--ok);color:var(--on-accent);border-color:var(--ok);}
.strip i.m{border-color:var(--danger);border-width:2px;}
.strip i.r{border-style:dashed;}
.strip i.v{opacity:.55;}
.leg{display:inline-flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt);margin-top:8px;padding:6px 12px;border-radius:10px;background:rgba(var(--surface-rgb),.9);border:1px solid var(--glass-b);}
.leg i{display:inline-flex;width:14px;height:14px;border-radius:3px;border:1px solid var(--glass-b);vertical-align:middle;margin-right:4px;align-items:center;justify-content:center;font-style:normal;font-size:9px;}
.pcard .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(92vw,480px);padding:10px 16px;border-radius:12px;background:rgba(var(--surface-rgb),.98);border:1px solid var(--accent);box-shadow:var(--shadow);font-weight:600;}
.toast[hidden]{display:none;}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);text-align:left;padding:6px 8px;}
.tbl td{padding:9px 8px;border-top:1px solid var(--glass-b);vertical-align:middle;}
.escala-aviso{font-size:12px;color:var(--txt);}
.ocorr li{padding:7px 0;}

@media (max-width:560px){
  .h1{font-size:20px;} .dois{grid-template-columns:1fr;}
  .seg button{padding:7px 9px;}
  .tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%;}
  .tbl tr{padding:10px 0;border-top:1px solid var(--glass-b);} .tbl td{border:0;padding:4px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;}
  .tbl td::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);flex:none;} .tbl td .bar{flex:1;}
}
@media (hover:none) and (pointer:coarse){ .btn,.seg button,.tabs button,.filtros button{min-height:44px;} input,select,textarea{font-size:16px;} }
@media (prefers-reduced-motion:reduce){ .porto .barco{animation:none;} }
</style>
</head>
<body>
<div class="ocean" aria-hidden="true"></div>
<header class="topo">
  <div class="topo-in">
    <div class="logo">⛵ Travessia</div>
    <span class="proto" title="Nada aqui é real: pessoas, números e datas são inventados">🧪 Protótipo · dados fictícios</span>
    <div class="sp"></div>
    <button class="btn" id="btn-tema" type="button" style="padding:5px 12px;min-height:38px;font-size:17px" aria-label="Trocar tema" title="Clique para alternar: 🌙 Abrolhos → ☀️ Lençóis Maranhenses → 🌅 Entardecer. Preferência salva só neste navegador.">🌙</button>
    <div class="row" style="gap:8px">
      <span class="lbl" id="lbl-papel">Ver como</span>
      <div class="seg" id="seg-papel" role="group" aria-labelledby="lbl-papel"></div>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>

function anel(p,size,cor){ const r=(size-8)/2,c=2*Math.PI*r; return `<div class="ring" style="width:${size}px;height:${size}px" role="img" aria-label="${p} % do plano"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--glass-b)" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${cor||'var(--accent)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}"/></svg><b>${p}%</b></div>`; }

function sinais(id){
  const p=PESSOAS[id], out=[];
  if(p.novo) out.push(['warn','🌱','Sem 1:1 marcado — chegou há 2 semanas']);
  else if(p.atrasoDias) out.push(['bad','⏰',`1:1 atrasado há ${p.atrasoDias} dias`]);

  if(p.pdiParado>=21) out.push(['warn','🧊',`PDI parado há ${p.pdiParado} dias`]);
  if(p.semFoco&&!p.novo) out.push(['warn','🧭','PDI sem foco definido']);
  if(!out.length) out.push(['ok','✅','Tudo em dia']);
  return out;
}

// ───────── planejador de 1:1 (recorrência + Escala) ─────────
function proxDiaSemana(base,dow){ const d=new Date(base); while(d.getDay()!==dow) d.setDate(d.getDate()+1); return d; }
function somaMes(d,m){ const t=new Date(d); const alvo=t.getMonth()+m; const sem=t.getDay(); const n=Math.floor((t.getDate()-1)/7); t.setDate(1); t.setMonth(alvo); const p=proxDiaSemana(t,sem); p.setDate(p.getDate()+n*7); return p; }
function ocorrencias(cfg){
  const out=[]; let d=proxDiaSemana(new Date(HOJE.getTime()+86400000),cfg.dow); let guard=0;
  while(out.length<8&&guard++<40){
    let real=new Date(d), motivo='';
    for(let k=0;k<10;k++){ const i=iso(real), w=real.getDay();
      const fer=FERIADOS[i], fol=(FOLGAS[cfg.pessoa]||{})[i];
      if(w===0||w===6||fer||fol){ if(!motivo) motivo=(fer?'feriado ('+fer+')':fol?'folga na Escala':'fim de semana'); real=new Date(real.getTime()+86400000); } else break; }
    out.push({data:real,orig:motivo?d:null,motivo});
    if(cfg.cad==='semanal') d=new Date(d.getTime()+7*86400000);
    else if(cfg.cad==='quinzenal') d=new Date(d.getTime()+14*86400000);
    else if(cfg.cad==='mensal') d=somaMes(d,1);
    else d=somaMes(d,3);
  }
  return out;
}

}

  return `<div class="stack"><section class="gl pad stack" aria-labelledby="h-t"><h2 class="h2" id="h-t">📈 Minha história no ciclo</h2>
   <p class="sub">Montada sozinha a partir do Maré, do Radar e dos Kudos. Serve para você lembrar o que fez — <b>é contexto de conversa, não nota</b>.</p>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"><div class="tile"><b>14</b><span>cards concluídos</span></div><div class="tile"><b>3</b><span>bloqueios destravados</span></div><div class="tile"><b>4</b><span>Kudos recebidos</span></div><div class="tile"><b>2</b><span>objetivos no Radar</span></div></div>
   <ul class="lst"><li><span class="chip">Radar</span><div class="tx">Objetivo “Receita do trimestre” — você é responsável · 68 %</div></li><li><span class="chip">Radar</span><div class="tx">Objetivo “Painel executivo de vendas” — concluído em 30/09</div></li><li><span class="chip">Maré</span><div class="tx">Maior entrega: “Modelo de previsão de churn” (card concluído em 12/09)</div></li><li><span class="chip">Kudos</span><div class="tx">“Análise salvou o dia da campanha” — Caio, 14/10</div></li></ul></section>
   <section class="gl pad stack" aria-labelledby="aa-t"><h2 class="h2" id="aa-t">📝 Autoavaliação</h2><p class="sub">Antes da conversa de ciclo. O Agente rascunha a partir da sua história; você reescreve do seu jeito.</p>
   <div class="row"><button class="btn p" data-act="autoav">🤖 Rascunhar a partir da minha história</button></div>
   <label class="sr" for="aav">Minha autoavaliação</label><textarea class="in" id="aav" data-in="autoav" placeholder="Como foi o ciclo para você?">${esc(S.autoav)}</textarea></section></div>`;
}

// ───────── PO: frota ─────────
function viewFrota(){
  const lista=IDS.filter(id=>S.filtro==='todos'||(S.filtro==='atencao'?atencao(id):!PESSOAS[id].proximo)).sort((a,b)=>(atencao(b)-atencao(a))||PESSOAS[a].nome.localeCompare(PESSOAS[b].nome));
  const nAt=IDS.filter(atencao).length;
  return `<div class="stack">
   <section class="gl pad" aria-labelledby="fr-t"><div class="row" style="justify-content:space-between"><h2 class="h2" id="fr-t">🚢 Frota — Squad Dados</h2><span class="chip ${nAt?'warn':'ok'}">${nAt?'⚠ '+nAt+' precisam de atenção':'✅ todos em dia'}</span></div>
    <div class="nota"><b>🤖 Resumo da semana (rascunho):</b> 4 conversas aconteceram, 1 ficou atrasada (Cauê) e o Gil ainda não tem 1:1 marcado. 2 PDIs sem foco. <button class="btn s" data-act="resumo" style="margin-left:6px">Copiar</button></div></section>
   <div class="filtros" role="group" aria-label="Filtrar pessoas">${[['todos','Todas'],['atencao','⚠ Precisam de atenção'],['sem','Sem 1:1 marcado']].map(([k,l])=>`<button data-act="filtro" data-f="${k}" aria-pressed="${S.filtro===k}">${l}</button>`).join('')}</div>
   ${lista.length?`<div class="grid g3">${lista.map(id=>{ const p=PESSOAS[id]; return `<article class="gl pcard ${atencao(id)?'at':''}" aria-label="${esc(p.nome)}"><div class="top"><div class="av" aria-hidden="true">${esc(ini(p.nome))}</div><div style="flex:1;min-width:0"><b>${esc(p.nome)}</b><div class="small">${esc(p.papel)}</div></div>${anel(id==='ana'?pctPdi(S.focos):pctPdi(p.focos),48)}</div>
     <div class="meta" style="margin-top:10px">${sinais(id).map(chip).join('')}</div>
     <p class="small" style="margin-top:8px">${p.proximo?`Próximo 1:1: <b>${esc(dia(new Date(p.proximo+'T12:00:00')))}</b> · ${esc(p.hora)}`:'Próximo 1:1: <b>não marcado</b>'}</p>${tira(p.tira)}
     <div class="acts"><button class="btn s p" data-act="abrir" data-id="${id}">Abrir</button><button class="btn s" data-act="agendar" data-id="${id}">📅 Marcar 1:1</button></div></article>`; }).join('')}</div>${LEG}`:'<div class="vazio">Ninguém neste filtro.</div>'}
   ${S.sel?viewDetalhe(S.sel):''}</div>`;
}
function viewDetalhe(id){
  const p=PESSOAS[id], focos=id==='ana'?S.focos:p.focos;
  return `<section class="gl pad stack" id="detalhe" aria-labelledby="dt-t" style="border-color:var(--accent)"><div class="row" style="justify-content:space-between"><h2 class="h2" id="dt-t">${esc(p.nome)} · visão do PO</h2><button class="btn s" data-act="fechar" aria-label="Fechar detalhe">✕ Fechar</button></div>
   <p class="small">Aqui você vê <b>o mesmo que ${esc(p.nome.split(' ')[0])} vê</b> (simetria), mais o seu espaço privado.</p>
   <div class="grid g2"><div class="stack"><h3 class="h2">🎯 PDI</h3>${blocoPdi(focos,false)}</div>
   <div class="stack"><h3 class="h2">🔒 Suas notas sobre ${esc(p.nome.split(' ')[0])} <span class="chip warn">só você vê</span></h3>
     ${(S.notas[id]||[]).length?`<ul class="lst">${S.notas[id].map(n=>`<li><span aria-hidden="true">🔒</span><div class="tx">${esc(n)}</div></li>`).join('')}</ul>`:'<div class="vazio">Sem notas ainda.</div>'}
     <form class="row" data-form="nota" data-id="${id}"><label class="sr" for="nn">Nova nota privada</label><input class="in" id="nn" name="t" maxlength="200" placeholder="Anotar (só você vê)…" autocomplete="off"><button class="btn s p" type="submit">Salvar</button></form>
     <div class="row"><button class="btn s" data-act="levar-rh" data-id="${id}">🤝 Levar ao encontro com o RH</button></div></div></div></section>`;
}
function viewNotas(){
  const ids=Object.keys(S.notas).filter(i=>S.notas[i].length);
  return `<section class="gl pad stack" aria-labelledby="nt-t"><h2 class="h2" id="nt-t">🔒 Minhas notas <span class="chip warn">só você vê</span></h2><p class="sub">Notas exclusivas do PO. Nem a pessoa, nem o gerente, nem o RH, nem o Agente Ágil leem.</p>
   ${ids.map(i=>`<div class="foco"><b>${esc(PESSOAS[i].nome)}</b><ul class="lst">${S.notas[i].map(n=>`<li><span aria-hidden="true">🔒</span><div class="tx">${esc(n)}</div></li>`).join('')}</ul></div>`).join('')||'<div class="vazio">Nenhuma nota ainda. Abra uma pessoa na Frota para anotar.</div>'}</section>`;
}
function viewPautaRh(){
  return `<section class="gl pad stack" aria-labelledby="pr-t"><h2 class="h2" id="pr-t">🤝 Pauta com o RH · próximo encontro qui 05/11</h2>
   <p class="sub">Seu espaço para preparar as conversas com o RH. Cada item nasce <b>privado</b>; marque “compartilhar” só se quiser que o RH veja antes.</p>
   <ul class="lst">${S.rh.map((r,i)=>`<li><span aria-hidden="true">${r.com?'👁':'🔒'}</span><div class="tx">${esc(r.t)}<div class="meta"><span class="chip ${r.com?'ok':'warn'}">${r.com?'Compartilhado com o RH':'Privado'}</span></div></div><button class="btn s" data-act="rh-toggle" data-i="${i}">${r.com?'Tornar privado':'Compartilhar'}</button></li>`).join('')}</ul>
   <form class="row" data-form="rh"><label class="sr" for="nr">Novo item</label><input class="in" id="nr" name="t" maxlength="160" placeholder="Algo para levar ao RH…" autocomplete="off"><button class="btn p" type="submit">+ Adicionar</button></form></section>`;
}

// ───────── gerente e RH ─────────
function viewCadeia(){
  return `<div class="stack"><section class="gl pad"><h2 class="h2">🏛 Frota dos POs</h2><p class="sub" style="margin-top:4px">Você acompanha os POs (1:1 e PDI como com qualquer pessoa) e vê o <b>agregado</b> de cada time. Detalhe por pessoa só se o PO compartilhar.</p></section>
   <div class="grid g3">${SQUADS.map(s=>`<article class="gl pcard ${s.atencao>=3?'at':''}"><div class="top"><div class="av" aria-hidden="true">${esc(ini(s.po))}</div><div style="flex:1"><b>${esc(s.po)}</b><div class="small">PO · ${esc(s.nome)} · ${s.pessoas} pessoas</div></div></div>
     <div style="margin-top:12px"><div class="row" style="justify-content:space-between"><span class="small">Constância dos 1:1</span><b>${s.adesao}%</b></div><div class="bar" role="img" aria-label="${s.adesao}% de constância"><i style="width:${s.adesao}%"></i></div></div>
     <div class="meta" style="margin-top:10px"><span class="chip">🎯 ${s.pdis} PDIs ativos</span><span class="chip ${s.atencao>=3?'warn':''}">${s.atencao>=3?'⚠ ':''}${s.atencao} precisam de atenção</span></div>
     <p class="small" style="margin-top:8px">Seu próximo 1:1 com ${esc(s.po.split(' ')[0])}: <b>${s.po==='Bruno Reis'?'qua 28/10':'a marcar'}</b></p></article>`).join('')}</div></div>`;
}
function viewRhVisao(){
  return `<div class="stack"><section class="gl pad stack"><h2 class="h2">🌊 Visão geral do ciclo · jul–dez 2026</h2>
   <div class="nota">🔒 <b>O que o RH vê:</b> constância, PDIs ativos, ciclo e o que os POs compartilharem. <b>Não vê:</b> notas privadas dos POs nem o conteúdo dos 1:1. <span class="small">(proposta — a validar com o RH)</span></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"><div class="tile"><b>24</b><span>pessoas no piloto</span></div><div class="tile"><b>76%</b><span>constância dos 1:1</span></div><div class="tile"><b>18</b><span>PDIs ativos</span></div><div class="tile"><b>8</b><span>pedem atenção</span></div></div></section>
   <section class="gl pad"><table class="tbl"><caption class="sr">Squads</caption><thead><tr><th>Squad</th><th>PO</th><th>Constância</th><th>PDIs</th><th>Atenção</th></tr></thead><tbody>${SQUADS.map(s=>`<tr><td data-l="Squad"><b>${esc(s.nome)}</b>${s.pilot?' <span class="chip ag">piloto</span>':''}</td><td data-l="PO">${esc(s.po)}</td><td data-l="Constância"><div class="bar" role="img" aria-label="${s.adesao}%"><i style="width:${s.adesao}%"></i></div><span class="small">${s.adesao}%</span></td><td data-l="PDIs ativos">${s.pdis}</td><td data-l="Atenção">${s.atencao>=3?'⚠ ':''}${s.atencao} pessoa(s)</td></tr>`).join('')}</tbody></table></section></div>`;
}
function viewRhPautas(){
  const comp=S.rh.filter(r=>r.com);
  return `<section class="gl pad stack"><h2 class="h2">🤝 Pautas compartilhadas pelos POs</h2><p class="sub">Só aparece o que o PO marcou como compartilhado.</p>
   ${comp.length?`<ul class="lst">${comp.map(r=>`<li><span aria-hidden="true">👁</span><div class="tx">${esc(r.t)}<div class="meta"><span class="chip">Bruno Reis · Squad Dados</span></div></div></li>`).join('')}</ul>`:'<div class="vazio">Nenhum item compartilhado ainda. (No papel de PO, abra “Pauta com o RH” e compartilhe um item.)</div>'}</section>`;
}

// ───────── montagem ─────────
function render(){
  const seg=$('#seg-papel'); seg.innerHTML=PAPEIS.map(([k,l])=>`<button data-papel="${k}" aria-pressed="${S.papel===k}">${l}</button>`).join('');
  const abas=TABS[S.papel], tab=S.tab[S.papel];
  const titulos={pessoa:['Olá, Ana 👋','Sua travessia: o que você quer construir e como a gente te ajuda a chegar lá.'],po:['Olá, Bruno 👋','Sua frota: como o time está e quem precisa de uma conversa.'],gerente:['Olá, Carla 👋','A visão dos POs que você lidera.'],rh:['Olá, Dani 👋','O ciclo de pessoas, sem abrir o que é privado.']};
  const V={pessoa:{inicio:viewInicio,pdi:viewPdi,um:viewUm,acoes:viewAcoes,historia:viewHistoria},po:{frota:viewFrota,planejar:viewPlanejar,notas:viewNotas,rh:viewPautaRh},gerente:{cadeia:viewCadeia,planejar:viewPlanejar},rh:{visao:viewRhVisao,pautas:viewRhPautas}};
  const foco=document.activeElement&&document.activeElement.id;
  $('#app').innerHTML=`<div class="hero"><div><h1 class="h1">${titulos[S.papel][0]}</h1><p class="sub">${titulos[S.papel][1]}</p></div></div>
   <div class="tabs" role="tablist" aria-label="Seções">${abas.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>
   <div role="tabpanel">${V[S.papel][tab]()}</div>`;
  if(foco){ const e=document.getElementById(foco); if(e) e.focus(); }
}

// ───────── eventos ─────────
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-papel],[data-tab],[data-act]'); if(!b) return;
  if(b.dataset.papel){ S.papel=b.dataset.papel; S.filtro='todos'; S.sel=null; try{ history.replaceState(null,'','#'+S.papel);}catch(_){} return render(); }
  if(b.dataset.tab&&!b.dataset.act){ S.tab[S.papel]=b.dataset.tab; S.filtro='todos'; return render(); }
  const a=b.dataset.act;
  if(a==='ir'){ S.tab[S.papel]=b.dataset.tab; return render(); }
  if(a==='filtro'){ S.filtro=b.dataset.f; return render(); }
  if(a==='abrir'){ S.sel=b.dataset.id; render(); const d=$('#detalhe'); if(d) d.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(a==='fechar'){ S.sel=null; return render(); }
  if(a==='agendar'){ S.plan={pessoa:b.dataset.id,tipo:'acomp',cad:'quinzenal',dow:4,hora:'10:00'}; S.tab.po='planejar'; return render(); }
  if(a==='criar-serie'){ const c=S.plan; toast(`✅ Série criada: ${CAD[c.cad]}, ${DIAS[c.dow]} às ${c.hora}. As próximas conversas já estão na agenda.`); return; }
  if(a==='pedir-copiloto'){ S.copilotoPedido=true; toast('🤖 Analisando feedbacks, entregas e objetivos…'); return render(); }
  if(a==='aceitar-foco'){ const c=COPILOTO[+b.dataset.i]; S.focos.push({t:c.t,rasc:true,acoes:c.acoes.map(x=>({tipo:x[0],t:x[1],done:false}))}); S.rasc.push(c.t); toast('Entrou no seu PDI como rascunho. Seu PO vai poder comentar.'); return render(); }
  if(a==='descartar-foco'){ S.rasc.push(COPILOTO[+b.dataset.i].t); return render(); }
  if(a==='editar-foco'){ toast('✏️ Na versão real você edita o texto antes de aceitar.'); return; }
  if(a==='add-sug'){ S.pauta.push({t:b.dataset.t,por:'Sugerido pelo sistema'}); return render(); }
  if(a==='notas-acoes'){ S.acoes.unshift({id:Date.now(),t:'Abrir tempo semanal para estudo (rascunho do Agente)',dono:'Ana',com:'Bruno',prazo:'05/11',origem:'1:1 de 15/10 · rascunho',done:false,dias:0}); toast('🤖 Criei 1 ação em rascunho na aba Ações.'); return render(); }
  if(a==='resumo'){ toast('📋 Resumo copiado (na versão real, para colar no WhatsApp ou no Mural).'); return; }
  if(a==='levar-rh'){ S.rh.unshift({t:'Sobre '+PESSOAS[b.dataset.id].nome.split(' ')[0]+': preciso de apoio do RH',com:false}); toast('🔒 Adicionado à sua pauta com o RH (privado).'); return; }
  if(a==='rh-toggle'){ const r=S.rh[+b.dataset.i]; r.com=!r.com; toast(r.com?'👁 Agora o RH vê esse item.':'🔒 Voltou a ser privado.'); return render(); }
  if(a==='autoav'){ S.autoav='Neste ciclo entreguei 14 cards, destravei 3 bloqueios e fui responsável por 2 objetivos no Radar. Meu maior orgulho foi o modelo de churn. Quero evoluir em comunicar análises e em liderar um projeto de ponta a ponta. (Rascunho do Agente — edite do seu jeito.)'; return render(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.plan){ S.plan=S.plan||{}; S.plan[t.dataset.plan]=t.dataset.plan==='dow'?+t.value:t.value; return render(); }
  if(t.dataset.act==='acao'){ const a=S.acoes.find(x=>x.id==t.dataset.id); a.done=t.checked; toast(a.done?'✅ Ação concluída':'↩ Ação reaberta'); return render(); }
  if(t.dataset.act==='acao-pdi'){ S.focos[+t.dataset.f].acoes[+t.dataset.a].done=t.checked; return render(); }
});
document.addEventListener('input',e=>{ if(e.target.dataset.in==='autoav') S.autoav=e.target.value; });
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const v=(new FormData(f).get('t')||'').trim(); if(!v) return;
  const k=f.dataset.form;
  if(k==='pauta') S.pauta.push({t:v,por:'Ana'});
  else if(k==='acao') S.acoes.unshift({id:Date.now(),t:v,dono:'Ana',com:'Bruno',prazo:'a definir',origem:'Adicionada por você',done:false,dias:0});
  else if(k==='nota'){ const id=f.dataset.id; (S.notas[id]=S.notas[id]||[]).unshift(v); }
  else if(k==='rh') S.rh.unshift({t:v,com:false});
  render();
});
const TEMAS=[['','🌙','Abrolhos'],['light','☀️','Lençóis Maranhenses'],['sunset','🌅','Entardecer']];
function aplicaTema(v,avisa){ const i=Math.max(0,TEMAS.findIndex(x=>x[0]===v)), t=TEMAS[i]; if(t[0]) document.documentElement.setAttribute('data-theme',t[0]); else document.documentElement.removeAttribute('data-theme'); $('#btn-tema').textContent=t[1]; try{ localStorage.setItem('travessia_tema',t[0]); }catch(_){} if(avisa) toast(t[1]+' '+t[2]); }
$('#btn-tema').addEventListener('click',()=>{ const atual=document.documentElement.getAttribute('data-theme')||''; const i=TEMAS.findIndex(x=>x[0]===atual); aplicaTema(TEMAS[(i+1)%TEMAS.length][0],true); });
try{ const t=localStorage.getItem('travessia_tema'); if(t) aplicaTema(t); }catch(_){}
const h=(location.hash||'').slice(1); if(TABS[h]) S.papel=h;
render();
})();
</script>
</body>
</html>
